<style>

:root{--ink:#1d2b3b;--blue:#133e62;--red:#d64b37;--gold:#c89334;--paper:#f9efd6;--paper2:#fff8e9;--light:#efddbc;--bg:#102034}

body{background:radial-gradient(circle at 70% 20%,#28546c 0%,#132d42 42%,#091521 100%); background-attachment:fixed}
button{font:inherit;cursor:pointer} a{color:inherit}
.mast{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;padding:22px 24px 18px}
.brand{font-family:system-ui,sans-serif;font-weight:1000;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;font-size:17px}
.brand small{display:block;font-size:10px;letter-spacing:.19em;color:#ffd175;margin-top:5px}
.mastnav{display:flex;align-items:center;gap:8px}

.smallbtn:focus-visible,.navbtn:focus-visible,.toc-entry:focus-visible{outline:3px solid #f0b94e;outline-offset:2px}
.smallbtn:hover{background:#f7efdc26}
.shell{max-width:1240px;margin:8px auto 0;padding:0 20px 10px}
.book{position:relative;min-height:680px;background:var(--paper);padding:23px 24px 27px 36px;border:9px solid #815433;border-radius:11px 16px 16px 10px;box-shadow:0 26px 12px -14px #0005,0 41px 65px #0008,inset 0 0 0 3px #dcb77c;overflow:hidden}
.book:before{content:'';display:block;position:absolute;left:15px;top:25px;bottom:25px;width:9px;background:repeating-linear-gradient(180deg,#301f1890 0 3px,#e6ad60 4px 11px,transparent 12px 28px);z-index:4}
.book:after{content:'';position:absolute;left:50%;top:13px;bottom:13px;width:16px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#b3976933 46%,#6b56302b 55%,transparent);pointer-events:none;z-index:2}
.spread{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;min-height:620px;background:var(--paper2);box-shadow:inset 0 0 23px #9e6d3426;border-radius:5px 11px 11px 5px;transform-origin:50% 50%}
.artpage{background:#efe2c8;display:flex;flex-direction:column;padding:26px 26px 20px;min-width:0;box-shadow:inset -12px 0 15px #8266400e;position:relative}
.artpage:after{content:'';position:absolute;right:7px;top:6%;height:86%;border-right:1px solid #93745524}
.pagekick{font-size:11px;letter-spacing:.22em;color:#7b6048;font-weight:1000;text-transform:uppercase}
.artframe{position:relative;margin:auto 0;max-width:460px;align-self:center;width:100%;padding:9px;background:#fff9e8;transform:rotate(-1.25deg);border:1px solid #d6b47d;box-shadow:1px 7px 9px #40270d40}
.artframe img{display:block;aspect-ratio:1;object-fit:cover;width:100%;image-rendering:pixelated;background:#c1ddf8}
.artframe:before,.artframe:after{content:'';height:24px;width:76px;background:#d9b77cbb;position:absolute;z-index:3;top:-13px;left:50%;transform:translateX(-50%) rotate(4deg);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%)}
.artframe:after{display:none}
.artcaption{margin-top:15px;text-align:center;font-size:12px;letter-spacing:.07em;color:#6f573e}
.txtpage{background:repeating-linear-gradient(to bottom,#fffaf0 0px,#fffaf0 30px,#b7bcaf69 31px,#fffaf0 32px);padding:28px 32px 48px 42px;position:relative;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;color:#a45e38;font-weight:800;font-size:11px;letter-spacing:.08em;gap:10px}
.chaptertitle{font-size:clamp(23px,2.8vw,35px);font-weight:950;line-height:1.25;margin:23px 0 17px;letter-spacing:-.03em}
.inkline{width:56px;height:5px;background:var(--red);margin-bottom:13px}
.story{font-size:14px;line-height:2.12;letter-spacing:.015em;white-space:normal}
.story p{margin:0 0 7px}
.story p:last-child{font-weight:900;color:#a93b2d}
.pagebottom{position:absolute;bottom:13px;left:42px;right:32px;border-top:1px solid #b0a38b;display:flex;align-items:center;justify-content:space-between;padding-top:9px;font-family:monospace;font-size:11px;color:#776b59}
.navi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 2px 0;color:#f6efd8}
.navbtn{border:2px solid #e2c393;background:#f6e6c7;color:#26313b;border-radius:5px;box-shadow:3px 4px 0 #27190f;padding:12px 18px;font-weight:950;letter-spacing:.01em;min-width:140px}
.navbtn:hover{transform:translateY(1px);box-shadow:2px 2px 0 #27190f}
.navbtn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.navcenter{text-align:center;font-size:12px;color:#e9d3ac;line-height:1.6}
.cover{min-height:615px;grid-column:1/-1;background:linear-gradient(135deg,#1d4361 0%,#11324d 53%,#0b2031 100%);color:#fff7db;padding:45px 35px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;position:relative;overflow:hidden}
.cover:before{content:'';position:absolute;inset:22px;border:4px double #d49b4f;pointer-events:none;border-radius:4px}
.cover:after{content:'';position:absolute;top:35px;left:46%;width:280px;height:280px;border:1px dashed #e8b56365;border-radius:50%;box-shadow:0 0 0 34px #f2b95b0b,0 0 0 80px #f2b95b07;pointer-events:none}
.cover .symbol{font-size:65px;z-index:1;filter:drop-shadow(0 5px 0 #0c1a28)}
.cover .mini{letter-spacing:.3em;color:#fbd49a;font-family:monospace;font-size:13px;font-weight:800;z-index:1}
.cover h1{font-weight:1000;font-size:clamp(37px,6vw,74px);line-height:1.07;letter-spacing:-.045em;max-width:720px;margin:0;z-index:1;text-shadow:4px 4px #081c30}
.cover .japan{font-size:20px;font-weight:900;color:#ffd07a;z-index:1}
.cover p{max-width:570px;font-size:16px;line-height:1.85;z-index:1}
.cover .mark{background:#d6422a;color:#fff;border:0;padding:14px 24px;font-weight:950;font-size:16px;box-shadow:5px 5px 0 #071826;z-index:2}
.cover .step{z-index:2;font-size:12px;color:#e6c99f}
.artpage.preface{background:linear-gradient(140deg,#e6ca95,#e8dabb);justify-content:center;align-items:center;text-align:center;gap:20px}
.preface .bigicon{font-size:110px;line-height:1.1;filter:drop-shadow(6px 8px 0 #ad855c)}
.preface .remark{font-weight:900;font-size:23px;color:#4d3a29}
.preface .subremark{font-size:13px;color:#755b42;line-height:1.9}
.lock{margin:0 auto 7px;text-align:center;font-size:11px;color:#e6d5b4}
.turn .spread{animation:turnpage .38s ease-in-out}

.toc{position:fixed;inset:0;background:#07121acf;z-index:10;display:none;align-items:center;justify-content:center;padding:24px}
.toc.active{display:flex}
.toc-panel{background:#fff8e6;color:var(--ink);border:8px solid #8b5935;box-shadow:0 20px 60px #0009;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:25px;border-radius:8px}
.toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #bd9471;padding-bottom:15px}
.toc-head h2{margin:0;font-size:25px}
.toc-close{border:0;background:#dd503f;color:white;padding:8px 13px;font-weight:900}
.toc-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}
.toc-entry{text-align:left;display:flex;gap:8px;align-items:center;background:#fcf2dd;border:1px solid #d6bd9d;border-radius:5px;padding:9px;cursor:pointer;color:#292c2d;min-width:0}
.toc-entry:hover{background:#f4dbb8}
.toc-entry:disabled{cursor:not-allowed;opacity:.48}
.toc-entry img{height:70px;width:70px;object-fit:cover;image-rendering:pixelated;border:2px solid #8e795e;flex:none}
.toc-entry .index{font-family:monospace;font-size:10px;color:#af4939;font-weight:bold}
.toc-entry .toc-title{font-weight:800;font-size:13px;margin-top:4px;line-height:1.45}
.toc-entry .toc-date{font-size:10px;color:#6b6559;margin-top:4px}
.sitefoot{max-width:1200px;text-align:center;color:#d0bd9e;padding:18px 20px 30px;margin:0 auto;font-size:12px;line-height:1.8}

.hero img{display:block;width:100%;height:auto;image-rendering:pixelated}
.mastnav a{text-decoration:none}

.stamp{font-family:monospace;border:2px solid #b97b4a;color:#b05c3b;transform:rotate(-5deg);padding:9px 16px;font-size:13px;font-weight:900;letter-spacing:.16em;margin:14px auto;z-index:1}
.preface .bigicon{display:none}
.tip{max-width:1240px;margin:0 auto 4px;padding:0 22px;color:#dcd1b9;font-size:12px;text-align:right}
