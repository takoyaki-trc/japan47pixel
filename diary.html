/* ====================================================
   プロローグ
   ==================================================== */

const prologueJA = [
  "毎日、鉄板の上で焼かれる。",
  "くるくるひっくり返されて、ソースを塗られて、最後は誰かのお腹の中へ。",

  "「もっと広い世界を旅したい。」",

  "鉄板から飛び出した。自由だ！",

  "「結局、たこ焼き屋からは逃げられないのか。」",
  "それでもエンジンは動き出した。",
  "最初の目的地は、北海道。"
];

const prologueEN = [
  "Every day, the same hot griddle.",
  "Flip. Sauce. Seaweed flakes. Then straight into somebody’s stomach.",
  "That was the entire life of a takoyaki.",
  "Until one day, a single takoyaki had a thought.",
  "“I want to see the world beyond this griddle.”",
  "And then—BOING!",
  "It launched itself into freedom.",
  "…And landed on top of a takoyaki truck.",
  "“So much for escaping the food industry.”",
  "Still, the engine started.",
  "First destination: HOKKAIDO."
];

/* ====================================================
   日時・公開判定
   ==================================================== */

chapters.forEach((chapter, index) => {
  chapter.releaseAt = new Date(
    Date.parse(FIRST_CHAPTER_JST) +
    index * RELEASE_EVERY_DAYS * 86400000
  ).toISOString();
});

function isPublished(chapter) {
  if (RELEASE_FIRST_NOW && chapter.id === 1) return true;
  return Date.now() >= Date.parse(chapter.releaseAt);
}

function publishedCount() {
  return chapters.filter(isPublished).length;
}

function formatDate(iso) {
  return new Intl.DateTimeFormat(
    currentLang === "ja" ? "ja-JP" : "en-GB",
    {
      year: "numeric",
      month: "short",
      day: "numeric",
      timeZone: TIMEZONE
    }
  ).format(new Date(iso));
}

function formatDateTime(iso) {
  return new Intl.DateTimeFormat(
    currentLang === "ja" ? "ja-JP" : "en-GB",
    {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
      timeZone: TIMEZONE
    }
  ).format(new Date(iso)) + " JST";
}

/* ====================================================
   言語・ページ管理
   ==================================================== */

const $ = id => document.getElementById(id);
const labels = {
  ja: {
    prev: "← 前のページ",
    next: "次のページ →",
    toc: "目次",
    home: "⌂ 公式サイト",
    tip: "📖 ページをめくって旅を続けよう",
    open: "日記を開く",
    cover: "表紙",
    prologue: "プロローグ",
    nextUpdate: "次の更新",
    complete: "北海道編 完結 · 次は青森",
    index: "📖 旅の目次"
  },
  en: {
    prev: "← PREVIOUS",
    next: "NEXT PAGE →",
    toc: "INDEX",
    home: "⌂ OFFICIAL",
    tip: "📖 Turn the pages to continue the journey",
    open: "OPEN THE DIARY",
    cover: "COVER",
    prologue: "PROLOGUE",
    nextUpdate: "NEXT UPDATE",
    complete: "HOKKAIDO COMPLETE · NEXT: AOMORI",
    index: "📖 THE INDEX"
  }
};

let currentLang = "ja";
try {
  currentLang = localStorage.getItem("ttdiary-language") === "en"
    ? "en" : "ja";
} catch (_) {}

let currentPage = 0;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function paragraphs(lines) {
  return lines.map(line =>
    `<p>${escapeHTML(line)}</p>`
  ).join("");
}

function currentLabels() {
  return labels[currentLang];
}

function setLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;

  try {
    localStorage.setItem("ttdiary-language", lang);
  } catch (_) {}

  $("langBtn").textContent = lang === "ja" ? "EN" : "日本語";
  $("tocLabel").textContent = currentLabels().toc;
  $("homeLink").textContent = currentLabels().home;
  $("tip").textContent = currentLabels().tip;
  $("prev").textContent = currentLabels().prev;
  $("next").textContent = currentLabels().next;

  renderPage(false);

  if ($("toc").classList.contains("active")) {
    buildIndex();
  }
}

/* ====================================================
   ノートの表示
   ==================================================== */

function renderPage(animate = true) {
  const spread = $("spread");
  const L = currentLabels();

  spread.classList.remove("turn");

  if (animate) {
    void spread.offsetWidth;
    spread.classList.add("turn");
  }

  // 表紙
  if (currentPage === 0) {
    spread.innerHTML = `
      <section class="cover">
        <div class="volume">
          TRAVELING TAKOYAKI — 01 / 47
        </div>
        <div class="symbol">🐙📖</div>
        <h1>TAKOYAKI<br>TRAVEL DIARY</h1>
        <div class="volume">HOKKAIDO · JAPAN 47 JOURNEY</div>
        <p>
          ${currentLang === "ja"
            ? "毎日焼かれて、最後は食べられる。そんな人生に疑問を持った、ひとつのたこ焼きが旅に出た。"
            : "A takoyaki escaped the griddle to discover the world beyond the frying pan."}
        </p>
        <button id="openDiary" class="open-button" type="button">
          ${L.open} →
        </button>
        <div class="sub">
          12 CHAPTERS · A NEW PAGE EVERY 2 DAYS
        </div>
      </section>
    `;

    $("openDiary").addEventListener("click", () => goToPage(1));
  }

  // プロローグ
  else if (currentPage === 1) {
    const story = currentLang === "ja" ? prologueJA : prologueEN;

    spread.innerHTML = `
      <section class="art-page">
        <div class="page-kicker">PROLOGUE 00 · BEFORE THE JOURNEY</div>
        <div class="photo">
          <img src="diary-assets/prologue.png"
               alt="鉄板の上で焼かれるたこ焼き">
        </div>
        <div class="photo-label">
          THE JOURNEY BEGINS HERE
        </div>
      </section>

      <section class="text-page">
        <div class="meta">
          <span>PROLOGUE 00</span>
          <span>01 / 47 · HOKKAIDO</span>
        </div>
        <h2 class="chapter-title">
          ${currentLang === "ja"
            ? "鉄板の向こう側"
            : "Beyond the Griddle"}
        </h2>
        <div class="red-rule"></div>
        <div class="story">${paragraphs(story)}</div>
        <div class="page-foot">
          <span>TRAVELING TAKOYAKI</span>
          <span>00</span>
        </div>
      </section>
    `;
  }

  // 各話
  else {
    const chapter = chapters[currentPage - 2];

    if (!chapter || !isPublished(chapter)) {
      currentPage = publishedCount() + 1;
      renderPage(false);
      return;
    }

    const title = currentLang === "ja"
      ? chapter.title : chapter.titleEn;

    const place = currentLang === "ja"
      ? chapter.place : chapter.placeEn;

    const story = currentLang === "ja"
      ? chapter.ja : chapter.en;

    const number = String(chapter.id).padStart(2, "0");

    const publishedDate = chapter.id === 1 && RELEASE_FIRST_NOW
      ? (currentLang === "ja" ? "公開中" : "NOW LIVE")
      : formatDate(chapter.releaseAt);

    spread.innerHTML = `
      <section class="art-page">
        <div class="page-kicker">
          HOKKAIDO PHOTO LOG · ${number}
        </div>
        <div class="photo">
          <img src="${chapter.image}" alt="${escapeHTML(place)}">
        </div>
        <div class="photo-label">
          ✦ ${escapeHTML(place)} ✦
        </div>
      </section>

      <section class="text-page">
        <div class="meta">
          <span>CHAPTER ${number} / 12</span>
          <span>${publishedDate}</span>
        </div>
        <h2 class="chapter-title">${escapeHTML(title)}</h2>
        <div class="red-rule"></div>
        <div class="story">${paragraphs(story)}</div>
        <div class="page-foot">
          <span>
            ${chapter.id === 12
              ? "NEXT STOP — AOMORI"
              : "TRAVELING TAKOYAKI · HOKKAIDO"}
          </span>
          <span>${number}</span>
        </div>
      </section>
    `;
  }

  // ページ番号とボタン状態
  const count = publishedCount();
  const maxPage = count + 1;

  $("prev").disabled = currentPage === 0;
  $("next").disabled = currentPage >= maxPage;

  $("indicator").textContent =
    currentPage === 0 ? L.cover :
    currentPage === 1 ? L.prologue :
    `CHAPTER ${String(currentPage - 1).padStart(2, "0")} / 12`;

  $("schedule").textContent = count < chapters.length
    ? `${L.nextUpdate}: ${formatDateTime(chapters[count].releaseAt)}`
    : L.complete;

  // 直接ページを開くURLのための記録
  const fragment = currentPage === 0 ? "" : `#page-${currentPage}`;
  history.replaceState(null, "", location.pathname + location.search + fragment);
}

function goToPage(page) {
  if (page < 0 || page > publishedCount() + 1) return;
  currentPage = page;
  renderPage(true);
}

/* ====================================================
   目次
   ==================================================== */

function buildIndex() {
  const list = $("tocList");
  const isJA = currentLang === "ja";

  let html = `
    <button class="toc-entry" data-page="1" type="button">
      <img src="diary-assets/prologue.png" alt="">
      <span>
        <div class="number">PROLOGUE 00</div>
        <div class="name">
          ${isJA ? "鉄板の向こう側" : "Beyond the Griddle"}
        </div>
        <div class="date">AVAILABLE NOW</div>
      </span>
    </button>
  `;

  chapters.forEach(chapter => {
    const open = isPublished(chapter);
    const number = String(chapter.id).padStart(2, "0");
    const title = isJA ? chapter.title : chapter.titleEn;

    html += `
      <button class="toc-entry"
              data-page="${chapter.id + 1}"
              ${open ? "" : "disabled"}
              type="button">
        <img src="${chapter.image}" alt="">
        <span>
          <div class="number">
            CHAPTER ${number} ${open ? "" : "🔒"}
          </div>
          <div class="name">${escapeHTML(title)}</div>
          <div class="date">
            ${chapter.id === 1 && open && RELEASE_FIRST_NOW
              ? "AVAILABLE NOW"
              : open
                ? formatDate(chapter.releaseAt)
                : formatDateTime(chapter.releaseAt)}
          </div>
        </span>
      </button>
    `;
  });

  list.innerHTML = html;

  list.querySelectorAll("button[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      goToPage(Number(button.dataset.page));
      closeIndex();
    });
  });
}

function openIndex() {
  buildIndex();
  $("toc").classList.add("active");
  $("tocClose").focus();
}

function closeIndex() {
  $("toc").classList.remove("active");
  $("tocBtn").focus();
}

/* ====================================================
   イベント
   ==================================================== */

$("prev").addEventListener("click", () => {
  goToPage(currentPage - 1);
});

$("next").addEventListener("click", () => {
  goToPage(currentPage + 1);
});

$("tocBtn").addEventListener("click", openIndex);
$("tocClose").addEventListener("click", closeIndex);

$("langBtn").addEventListener("click", () => {
  setLanguage(currentLang === "ja" ? "en" : "ja");
});

$("toc").addEventListener("click", event => {
  if (event.target === $("toc")) closeIndex();
});

// キーボード操作
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    if ($("toc").classList.contains("active")) closeIndex();
    return;
  }

  if ($("toc").classList.contains("active")) return;

  if (event.key === "ArrowRight") goToPage(currentPage + 1);
  if (event.key === "ArrowLeft") goToPage(currentPage - 1);
});

// スマートフォンのスワイプ操作
let startX = null;

$("spread").addEventListener("touchstart", event => {
  startX = event.touches[0].clientX;
}, { passive: true });

$("spread").addEventListener("touchend", event => {
  if (startX === null) return;

  const distance = event.changedTouches[0].clientX - startX;
  startX = null;

  if (Math.abs(distance) > 65) {
    goToPage(currentPage + (distance < 0 ? 1 : -1));
  }
}, { passive: true });

// 初期ページ
const match = location.hash.match(/^#page-(\d+)$/);
currentPage = Math.min(
  match ? Number(match[1]) : 0,
  publishedCount() + 1
);

setLanguage(currentLang);

// ページを開いたまま公開時間になった場合も更新
setInterval(() => {
  renderPage(false);
  if ($("toc").classList.contains("active")) buildIndex();
}, 60000);

</script>
