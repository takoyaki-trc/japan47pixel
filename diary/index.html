
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11283b">

<title>TRAVEL DIARY | TRAVELING TAKOYAKI</title>

<meta name="description"
content="One takoyaki. Forty-seven prefectures. A pixel-art journey across Japan.">

<!-- 丸みのある日本語・英語フォント -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

/* =====================================
   基本カラー・フォント
===================================== */

:root {
  --navy: #11283b;
  --ink: #35271d;
  --brown: #795333;
  --cream: #fff9ed;
  --kraft: #d5ae7b;
  --red: #bb4935;
  --line: #d9cbb5;

  --font-main:
    "Zen Maru Gothic",
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    sans-serif;

  --font-en:
    "Fredoka",
    "Zen Maru Gothic",
    sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      #2b4c64 0%,
      #11283b 65%,
      #071521 100%
    );

  color: var(--ink);
  font-family: var(--font-main);
}

button {
  font: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: .42;
  cursor: not-allowed;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #ffce69;
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

/* =====================================
   HEADER
===================================== */

.header {
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 13px 12px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.site-title {
  font-family: var(--font-en);
  color: #fff3d9;
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
}

.header-buttons {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.header-button {
  height: 40px;
  min-width: 45px;
  padding: 0 12px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: #fffaf0;
  color: #171717;

  border: 2px solid #10151a;
  border-radius: 0;
  box-shadow: 4px 4px 0 #06131c;

  text-decoration: none;
  white-space: nowrap;

  font-family: var(--font-main);
  font-size: 12px;
  font-weight: 900;
}

.header-button:hover {
  background: #ffeecb;
}

#languageBtn {
  min-width: 82px;
}

.home-button {
  font-size: 24px;
}

/* =====================================
   MAIN / BANNER
===================================== */

.main {
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 0 12px;
}

.banner {
  border: 4px solid #e0b866;
  border-radius: 7px;

  overflow: hidden;
  background: #4aa7d4;

  box-shadow: 4px 5px 0 #061521;
}

.banner img {
  display: block;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
}

.banner-fallback {
  min-height: 155px;
  padding: 20px;

  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;

  background:
    linear-gradient(
      #61b8e7 0%,
      #c6e9f5 60%,
      #8aa567 61%,
      #355b42 85%,
      #394150 86%
    );

  text-align: center;
}

.banner-fallback strong {
  font-family: var(--font-en);
  font-size: clamp(25px, 5vw, 46px);
  font-weight: 700;
  color: #172e42;
  text-shadow: 2px 2px #fff;
}

.banner-fallback span {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .12em;
}

/* =====================================
   リング穴付きノート
===================================== */

.notebook {
  position: relative;

  margin: 20px 0 16px;
  padding: 13px 13px 13px 42px;

  border: 7px solid #85532f;
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #e7c18a,
      #c99965
    );

  box-shadow:
    0 15px 35px #0006,
    inset 0 0 0 4px #f2d4a3;
}

/* 左側の四角い穴 */

.notebook::before {
  content: "";
  position: absolute;

  top: 19px;
  bottom: 19px;
  left: 13px;
  width: 17px;

  background:
    repeating-linear-gradient(
      to bottom,
      #59402a 0 13px,
      #e7c995 13px 36px
    );

  box-shadow:
    inset 2px 1px 2px #26170d88,
    1px 0 0 #f6dbae;
}

.page {
  min-height: 560px;
  background: var(--cream);
  overflow: hidden;
  border-radius: 2px;
}

.page.flipping {
  animation: pageFlip .35s ease-out;
}

@keyframes pageFlip {
  from {
    opacity: .55;
    transform:
      perspective(1200px)
      rotateY(-6deg);
  }

  to {
    opacity: 1;
    transform:
      perspective(1200px)
      rotateY(0);
  }
}

/* =====================================
   クラフト紙の表紙
===================================== */

.cover {
  position: relative;

  min-height: 590px;
  padding: 44px 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  background-color: var(--kraft);

  background-image:
    radial-gradient(
      #80593730 1px,
      transparent 1px
    ),
    repeating-linear-gradient(
      10deg,
      transparent 0 12px,
      #80563712 13px 14px,
      transparent 15px 26px
    ),
    linear-gradient(
      150deg,
      #e7cca6,
      #d3ad79 55%,
      #c19666
    );

  background-size:
    15px 17px,
    auto,
    auto;
}

.cover::before {
  content: "";
  position: absolute;
  inset: 17px;
  border: 3px double #725237;
  pointer-events: none;
}

.cover-inner {
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: 650px;
}

.cover-brand {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .12em;
  color: #4d3625;
}

.cover-decoration {
  margin: 17px auto 25px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  color: #6d5037;
}

.cover-decoration::before,
.cover-decoration::after {
  content: "";
  width: 25%;
  height: 1px;
  background: #694c34;
}

.cover-stamp {
  display: inline-block;

  padding: 8px 18px;
  margin-bottom: 25px;

  border: 3px solid #a74130;

  color: #a74130;
  font-size: clamp(13px, 3.5vw, 22px);
  font-weight: 900;
  letter-spacing: .1em;

  transform: rotate(-5deg);
}

.cover-title {
  font-family: var(--font-main);

  font-size: clamp(36px, 8vw, 76px);
  font-weight: 900;
  line-height: 1.13;
  letter-spacing: -.045em;

  color: #302216;

  margin: 0;
}

.cover-title span {
  display: block;
}

.cover-title.english {
  font-family: var(--font-en);
  letter-spacing: -.025em;
}

.cover-subtitle {
  width: 88%;
  margin: 24px auto 0;
  padding-top: 15px;

  border-top: 2px solid #866342;

  color: #a73e2e;
  font-size: clamp(17px, 3.5vw, 26px);
  font-weight: 900;
}

.cover-description {
  max-width: 510px;
  margin: 23px auto;

  font-size: 16px;
  font-weight: 700;
  line-height: 1.65;
}

.cover-open {
  margin-top: 19px;
  padding: 13px 27px;

  border: 3px solid #3c251d;

  background: #c34835;
  color: #fff;

  font-size: 19px;
  font-weight: 900;

  box-shadow: 5px 5px 0 #5b3d2b;
}

.cover-open:hover {
  background: #ab3828;
}

.cover-bottom {
  margin-top: 31px;

  color: #63482e;
  font-size: 13px;
  font-weight: 700;
}

/* =====================================
   各話のノートページ
===================================== */

.diary-spread {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 570px;
}

/* 画像側 */

.image-side {
  padding: 25px 22px;

  min-width: 0;

  background: #ecdec3;
  border-right: 1px solid #baa17c;

  display: flex;
  flex-direction: column;
}

.chapter-label {
  font-family: var(--font-en);

  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;

  color: #88684d;
  margin-bottom: 22px;
}

.photo {
  position: relative;

  width: min(100%, 440px);
  margin: auto;

  padding: 12px 12px 24px;

  background: #fffaf0;

  box-shadow:
    3px 8px 18px #4b382b50;

  transform: rotate(-1deg);
}

.photo::before {
  content: "";
  position: absolute;

  top: -12px;
  left: calc(50% - 40px);

  width: 80px;
  height: 24px;

  background: #c3a16a9c;
  transform: rotate(3deg);
  z-index: 2;
}

.photo img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;

  image-rendering: pixelated;
}

.photo-placeholder {
  display: none;

  aspect-ratio: 1;
  padding: 18px;

  background:
    linear-gradient(
      160deg,
      #a4d0d8,
      #6f9b93 55%,
      #527750
    );

  align-items: center;
  justify-content: center;

  color: #fff;
  text-align: center;
  font-weight: 900;
}

.photo figcaption {
  margin-top: 13px;

  color: #765d43;
  text-align: center;

  font-size: 12px;
  font-weight: 700;
}

/* 本文側 */

.text-side {
  min-width: 0;

  padding: 27px 30px 20px 35px;

  display: flex;
  flex-direction: column;

  background:
    repeating-linear-gradient(
      to bottom,
      #fffaf0 0 31px,
      #d8ccba 32px,
      #fffaf0 33px
    );
}

.page-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;

  color: #856b50;

  font-size: 11px;
  font-weight: 900;
}

.diary-title {
  margin: 22px 0 13px;

  color: #35271d;

  font-family: var(--font-main);
  font-size: clamp(23px, 3vw, 35px);
  font-weight: 900;

  line-height: 1.28;
  letter-spacing: -.02em;
}

.title-rule {
  width: 65px;
  height: 5px;
  margin-bottom: 20px;
  background: #c44a37;
}

/* ★ 行間・段落間隔の重要な修正 ★ */

.diary-text {
  font-family: var(--font-main);

  font-size: 16px;
  font-weight: 500;

  /* 以前より行間を縮小 */
  line-height: 1.72;

  letter-spacing: .01em;
  overflow-wrap: anywhere;
}

.diary-text p {
  /* 段落間の余白を大幅に縮小 */
  margin: 0 0 .34em;
}

.diary-text p:last-child {
  color: #a54737;
  font-weight: 900;
}

/* 最下部のページ番号 */

.page-footer {
  margin-top: auto;
  padding-top: 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  border-top: 1px solid #c1ad91;

  color: #7b6852;

  font-family: var(--font-en);
  font-size: 11px;
}

/* =====================================
   ページ移動ボタン
===================================== */

.page-navigation {
  margin: 18px 0 25px;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
}

.page-nav-button {
  min-height: 50px;
  padding: 10px 14px;

  background: #f5e5c9;
  color: #36281b;

  border: 2px solid #c0a57f;
  border-radius: 5px;

  box-shadow: 3px 3px 0 #071521;

  font-size: 13px;
  font-weight: 900;
  white-space: nowrap;
}

.page-nav-button:last-child {
  justify-self: end;
}

.page-progress {
  color: #f5e6d0;
  text-align: center;

  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
}

.next-release {
  display: block;
  margin-top: 5px;

  color: #d4c2a6;
  font-size: 10px;
  font-weight: 500;
}

/* =====================================
   目次
===================================== */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;

  padding: 16px;

  display: none;
  align-items: center;
  justify-content: center;

  background: #071521e8;
}

.modal.open {
  display: flex;
}

.modal-panel {
  width: min(760px, 100%);
  max-height: 90vh;

  padding: 18px;
  overflow-y: auto;

  background: #f9ecd4;

  border: 6px solid #865b37;
  border-radius: 8px;
}

.modal-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding-bottom: 12px;

  border-bottom: 1px solid #c4a67f;
}

.modal-heading h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 900;
}

.close-button {
  padding: 8px 13px;

  background: #c44837;
  color: white;

  border: 0;
  font-weight: 900;
}

.chapter-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-top: 15px;
}

.chapter-item {
  min-height: 75px;
  padding: 11px;

  background: #fffaf0;
  color: #3c2b1e;

  border: 1px solid #d1b592;
  text-align: left;
}

.chapter-item strong {
  display: block;
  font-size: 13px;
  line-height: 1.5;
}

.chapter-item small {
  display: block;
  color: #896a50;
  font-size: 11px;
  margin-bottom: 4px;
}

.chapter-item.locked {
  background: #e8dbc5;
  opacity: .65;
}

/* =====================================
   FOOTER
===================================== */

.footer {
  padding: 7px 0 30px;

  color: #d9c7ab;
  text-align: center;

  font-family: var(--font-en);
  font-size: 12px;
}

/* =====================================
   スマートフォン最適化
===================================== */

@media(max-width: 760px) {

  .header {
    padding: 11px 9px;
  }

  .site-title {
    font-size: 13px;
  }

  .header-buttons {
    gap: 5px;
  }

  .header-button {
    height: 37px;
    min-width: 38px;
    padding: 0 8px;

    font-size: 11px;
    box-shadow: 3px 3px 0 #071420;
  }

  #languageBtn {
    min-width: 70px;
  }

  .main {
    padding: 0 9px;
  }

  .banner {
    border-width: 3px;
  }

  .notebook {
    margin-top: 17px;
    padding: 10px 10px 10px 35px;
    border-width: 6px;
  }

  .notebook::before {
    left: 9px;
    top: 17px;
    bottom: 17px;
    width: 14px;

    background:
      repeating-linear-gradient(
        to bottom,
        #59402a 0 12px,
        #e7c995 12px 34px
      );
  }

  .page {
    min-height: 0;
  }

  .cover {
    min-height: 530px;
    padding: 42px 18px;
  }

  .cover::before {
    inset: 12px;
  }

  .cover-brand {
    font-size: 11px;
  }

  .cover-description {
    font-size: 15px;
    line-height: 1.65;
  }

  .diary-spread {
    display: block;
    min-height: 0;
  }

  .image-side {
    border-right: 0;
    padding: 18px 16px;
  }

  .chapter-label {
    margin-bottom: 16px;
  }

  .photo {
    width: min(88%, 420px);
  }

  .text-side {
    min-height: 360px;
    padding: 25px 20px 18px;
  }

  .diary-title {
    font-size: 26px;
    line-height: 1.3;
  }

  /* ★ スマホでの文字表示 ★ */

  .diary-text {
    font-size: 17px;
    line-height: 1.72;
    letter-spacing: .005em;
  }

  .diary-text p {
    margin-bottom: .3em;
  }

  .page-nav-button {
    min-height: 47px;
    padding: 8px 9px;
    font-size: 12px;
  }

  .page-progress {
    font-size: 11px;
  }

  .next-release {
    font-size: 10px;
  }

  .chapter-list {
    grid-template-columns: 1fr;
  }
}

@media(max-width: 370px) {

  .site-title {
    font-size: 11px;
  }

  .header-button {
    font-size: 10px;
    padding: 0 6px;
  }

  #languageBtn {
    min-width: 63px;
  }

  .notebook {
    padding-left: 30px;
  }

  .cover-title {
    font-size: 34px;
  }

  .page-navigation {
    gap: 5px;
  }

  .page-nav-button {
    font-size: 11px;
  }

  .diary-text {
    font-size: 16px;
  }
}

@media(prefers-reduced-motion: reduce) {
  .page.flipping {
    animation: none;
  }

  html {
    scroll-behavior: auto;
  }
}

</style>
</head>

<body>

<!-- =====================================
     HEADER
===================================== -->

<header class="header">

  <div class="site-title">
    TRAVEL DIARY
  </div>

  <nav class="header-buttons"
       aria-label="Diary navigation">

    <button
      id="indexBtn"
      class="header-button"
      type="button">
      INDEX
    </button>

    <button
      id="languageBtn"
      class="header-button"
      type="button">
      日本語
    </button>

    <a
      class="header-button home-button"
      href="https://japan47pixel.net/"
      title="Official Site"
      aria-label="Official Site">⌂</a>

  </nav>

</header>

<!-- =====================================
     MAIN
===================================== -->

<main class="main">

  <!-- タイトル画像 -->

  <section class="banner" id="banner">

    <img
      id="bannerImage"
      src="./assets/cover.png"
      alt="TRAVELING TAKOYAKI JAPAN 47 JOURNEY">

    <div class="banner-fallback" id="bannerFallback">
      <strong>TRAVELING TAKOYAKI</strong>
      <span>JAPAN 47 JOURNEY</span>
    </div>

  </section>

  <!-- リング穴付きノート -->

  <section class="notebook" id="notebook">

    <div class="page" id="diaryPage">

      <article class="cover">
        <div class="cover-inner">
          <h1 class="cover-title english">
            <span>TAKOYAKI</span>
            <span>TRAVEL DIARY</span>
          </h1>
        </div>
      </article>

    </div>

  </section>

  <!-- ページ移動 -->

  <nav class="page-navigation">

    <button
      id="prevBtn"

    </button>

    <div class="page-progress">

      <span id="pageIndicator">

      </span>

      <span id="nextRelease"
            class="next-release"></span>

    </div>

    <button
      id="nextBtn"
      class="page-nav-button"
      type="button">
      NEXT →
    </button>

  </nav>

</main>

<footer class="footer">
  © TRAVELING TAKOYAKI
</footer>

<!-- =====================================
     目次
===================================== -->

<div
  class="modal"
  id="indexModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="indexTitle">

  <div class="modal-panel">

    <div class="modal-heading">

      <h2 id="indexTitle">
        INDEX
      </h2>

      <button
        class="close-button"
        id="closeIndex"
        type="button">
        ×
      </button>

    </div>

    <div class="chapter-list"
         id="chapterList"></div>

  </div>

</div>

<script>

/* =====================================
   TRAVELING TAKOYAKI
   DIARY ENGINE

   Firebase・リアクション・コメント不要
===================================== */

(function () {
  "use strict";

  /* =====================================
     公開スケジュール
  ===================================== */

  // 第1話は公開済み
  const FIRST_RELEASE =
    "2026-11-01T00:00:00+09:00";

  // 第2話は11月3日10時
  const SECOND_RELEASE =
    "2026-11-03T10:00:00+09:00";

  // 2日ごとに公開
  const INTERVAL_DAYS = 2;

  /* =====================================
     プロローグ
  ===================================== */

  const prologue = {

    ja: [
      "毎日、鉄板の上で焼かれる。",
      "くるくるひっくり返されて、ソースを塗られて、最後は誰かのお腹の中へ。",
      "それが、たこ焼きの人生だった。",
      "でも、ある日、ひとつのたこ焼きが思った。",
      "「もっと広い世界を旅したい。」",
      "そして次の瞬間——ぽーーーーん！",
      "鉄板から飛び出した。自由だ！",
      "……着地した先は、たこ焼きカーの屋根だった。",
      "「結局、たこ焼き屋からは逃げられないのか。」",
      "それでもエンジンは動き出した。",
      "最初の目的地は、北海道。"
    ],

    en: [
      "Every day, the same hot griddle.",
      "Flip. Sauce. Seaweed flakes. Then straight into somebody’s stomach.",
      "That was the entire life of a takoyaki.",
      "Until one day, a single takoyaki had a thought.",
      "“I want to see the world beyond this griddle.”",

  const pad = number =>
    String(number).padStart(2, "0");

  chapters.forEach((chapter, index) => {

    chapter.image =
      "./assets/hokkaido-" + pad(chapter.id) + ".png";

    chapter.release =
      index === 0
        ? FIRST_RELEASE
        : new Date(
            Date.parse(SECOND_RELEASE) +
            (index - 1) *
            INTERVAL_DAYS *
            86400000
          ).toISOString();

  });

  /* =====================================
     状態管理
  ===================================== */

  const $ = id => document.getElementById(id);

  let language = "en";
  let currentPage = 0;

  try {
    language =
      localStorage.getItem("travel-diary-language") === "ja"
        ? "ja"
        : "en";
  } catch (error) {
    language = "en";
  }

  function escapeHTML(text) {
    return String(text ?? "").replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character])
    );
  }

  function isPublished(chapter) {
    return Date.now() >= Date.parse(chapter.release);
  }

  function publishedCount() {
    return chapters.filter(isPublished).length;
  }

  function maxPage() {
    return publishedCount() + 1;
  }

  function formatDate(iso) {
    return new Intl.DateTimeFormat(
      language === "ja" ? "ja-JP" : "en-GB",
      {
        timeZone: "Asia/Tokyo",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).format(new Date(iso)) + " JST";
  }

  function paragraphs(lines) {
    return lines.map(line =>
      "<p>" + escapeHTML(line) + "</p>"
    ).join("");
  }

  function chapterTitle(chapter) {
    return language === "ja"
      ? chapter.jaTitle
      : chapter.enTitle;
  }

  function chapterPlace(chapter) {
    return language === "ja"
      ? chapter.jaPlace
      : chapter.enPlace;
  }

  function setupBanner() {

    const image = $("bannerImage");
    const fallback = $("bannerFallback");

    function success() {
      image.style.display = "block";
      fallback.style.display = "none";
    }

    function failure() {
      image.style.display = "none";
      fallback.style.display = "flex";
    }

    image.addEventListener("load", success);
    image.addEventListener("error", failure);

    if (image.complete) {
      if (image.naturalWidth > 0) {
        success();
      } else {
        failure();
      }
    }
  }

  function setupStoryImage() {

    const image = $("storyImage");
    const placeholder = $("photoPlaceholder");

    if (!image || !placeholder) return;

    function success() {
      image.style.display = "block";
      placeholder.style.display = "none";
    }

    function failure() {
      image.style.display = "none";
      placeholder.style.display = "flex";
    }

    image.addEventListener("load", success);
    image.addEventListener("error", failure);

    if (image.complete) {
      if (image.naturalWidth > 0) {
        success();
      } else {
        failure();
      }
    }
  }

  /* =====================================
     本文描画
  ===================================== */

  function renderStory() {

    const isPrologue = currentPage === 1;

    const chapter = isPrologue
      ? null
      : chapters[currentPage - 2];

    if (chapter && !isPublished(chapter)) {
      currentPage = maxPage();
      render();
      return;
    }

    const title = isPrologue
      ? (language === "ja"
          ? "鉄板の向こう側"
          : "Beyond the Griddle")
      : chapterTitle(chapter);

    const place = isPrologue
      ? (language === "ja"
          ? "旅のはじまり"
          : "Before the Journey")
      : chapterPlace(chapter);

    const label = isPrologue
      ? "PROLOGUE 00"
      : "CHAPTER " + pad(chapter.id) + " / 12";

    const lines = isPrologue
      ? prologue[language]
      : chapter[language];

    const imagePath = isPrologue
      ? "./assets/prologue.png"
      : chapter.image;

    const number = isPrologue
      ? "00"
      : pad(chapter.id);

    const date = isPrologue
      ? "01 / 47 · HOKKAIDO"
      : formatDate(chapter.release);

    $("diaryPage").innerHTML = `
      <article class="diary-spread">

        <section class="image-side">

          <div class="chapter-label">
            ${escapeHTML(label)}
          </div>

          <figure class="photo">

              id="photoPlaceholder">
              ${escapeHTML(place)}
            </div>

  /* =====================================
     ページ全体の描画
  ===================================== */

  function render() {

    document.documentElement.lang = language;

    $("languageBtn").textContent =
      language === "ja"
        ? "ENGLISH"
        : "日本語";

    $("indexBtn").textContent =
      language === "ja"
        ? "目次"
        : "INDEX";

    $("prevBtn").textContent =
      language === "ja"
        ? "← 前へ"
        : "← PREVIOUS";

    $("nextBtn").textContent =
      language === "ja"
        ? "次へ →"
        : "NEXT →";

    $("prevBtn").disabled =
      currentPage === 0;

    $("nextBtn").disabled =
      currentPage >= maxPage();

    const element = $("diaryPage");

    element.classList.remove("flipping");

    void element.offsetWidth;

    element.classList.add("flipping");

    if (currentPage === 0) {
      renderCover();
    } else {
      renderStory();
    }

    if (currentPage === 0) {

      $("pageIndicator").textContent =
        language === "ja"
          ? "表紙"
          : "COVER";

    } else if (currentPage === 1) {

      $("pageIndicator").textContent =
        language === "ja"
          ? "プロローグ"
          : "PROLOGUE";

    } else {

      $("pageIndicator").textContent =
        "CHAPTER " +
        pad(currentPage - 1) +
        " / 12";
    }

    const count = publishedCount();

    if (count < chapters.length) {

      $("nextRelease").textContent =
        (language === "ja"
          ? "次の公開："
          : "NEXT: ") +
        formatDate(chapters[count].release);

    } else {

      $("nextRelease").textContent =
        language === "ja"
          ? "北海道編 完結"
          : "HOKKAIDO COMPLETE";
    }

    /* URLのページ番号 */

    try {

      const hash = currentPage === 0
        ? ""
        : "#page-" + currentPage;

      history.replaceState(
        null,
        "",
        location.pathname +
        location.search +
        hash
      );

    } catch (error) {
      // ローカル表示でも動作を続ける
    }
  }

  /* =====================================
     ページ移動
  ===================================== */

  function goToPage(targetPage) {

    if (
      targetPage < 0 ||
      targetPage > maxPage()
    ) {
      return;
    }

    currentPage = targetPage;

    render();

    $("notebook").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  /* =====================================
     目次
  ===================================== */

  function openIndex() {

    const items = [
      {
        page: 1,

        title: language === "ja"
          ? "鉄板の向こう側"
          : "Beyond the Griddle",

        label: "PROLOGUE 00",
        open: true,
        release: null
      },

      ...chapters.map(chapter => ({
        page: chapter.id + 1,
        title: chapterTitle(chapter),
        label: "CHAPTER " + pad(chapter.id),
        open: isPublished(chapter),
        release: chapter.release
      }))
    ];

    $("chapterList").innerHTML =
      items.map(item => `
        <button
          class="chapter-item ${item.open ? "" : "locked"}"
          type="button"
          data-page="${item.page}"
          ${item.open ? "" : "disabled"}>

          <small>
            ${item.open ? "📖" : "🔒"}
            ${escapeHTML(item.label)}
          </small>

          <strong>
            ${escapeHTML(item.title)}
          </strong>

          ${item.release
            ? `<small>${escapeHTML(formatDate(item.release))}</small>`
            : ""}

        </button>
      `).join("");

    $("chapterList")
      .querySelectorAll("[data-page]")
      .forEach(button => {

        button.addEventListener("click", () => {

          closeIndex();

          goToPage(
            Number(button.dataset.page)
          );
        });

      });

    $("indexTitle").textContent =
      language === "ja"
        ? "旅の目次"
        : "INDEX";

    $("indexModal").classList.add("open");

    $("closeIndex").focus();
  }

  function closeIndex() {
    $("indexModal").classList.remove("open");
  }

  /* =====================================
     ボタン操作
  ===================================== */

  $("prevBtn").addEventListener("click", () => {
    goToPage(currentPage - 1);
  });

  $("nextBtn").addEventListener("click", () => {
    goToPage(currentPage + 1);
  });

  $("indexBtn").addEventListener(
    "click",
    openIndex
  );

  $("closeIndex").addEventListener(
    "click",
    closeIndex
  );

  $("indexModal").addEventListener(
    "click",
    event => {

      if (event.target === $("indexModal")) {
        closeIndex();
      }

    }
  );

  /* =====================================
     日本語 / 英語 切替
  ===================================== */

  $("languageBtn").addEventListener(
    "click",
    () => {

      language =
        language === "ja" ? "en" : "ja";

      try {
        localStorage.setItem(
          "travel-diary-language",
          language
        );
      } catch (error) {}

      render();
    }
  );

  /* =====================================
     キーボード操作
  ===================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (event.key === "Escape") {
        closeIndex();
        return;
      }

      if (
        $("indexModal").classList.contains("open")
      ) {
        return;
      }

      if (event.key === "ArrowRight") {
        goToPage(currentPage + 1);
      }

      if (event.key === "ArrowLeft") {
        goToPage(currentPage - 1);
      }

    }
  );

  /* =====================================
     スマホのスワイプ
  ===================================== */

  let touchStartX = null;

  $("diaryPage").addEventListener(
    "touchstart",
    event => {

      touchStartX =
        event.touches[0].clientX;

    },
    { passive: true }
  );

  $("diaryPage").addEventListener(
    "touchend",
    event => {

      if (touchStartX === null) return;

      const distance =
        event.changedTouches[0].clientX -
        touchStartX;

      touchStartX = null;

      if (Math.abs(distance) > 85) {
        goToPage(
          currentPage +
          (distance < 0 ? 1 : -1)
        );
      }

    },
    { passive: true }
  );

  /* =====================================
     初期化
  ===================================== */

  setupBanner();

  const hashMatch =
    location.hash.match(/^#page-(\d+)$/);

  currentPage = Math.min(
    hashMatch
      ? Number(hashMatch[1])
      : 0,
    maxPage()
  );

  render();

  /* =====================================
     新しい話の公開チェック
  ===================================== */

  let lastPublished = publishedCount();

  setInterval(() => {

    const count = publishedCount();

    if (count !== lastPublished) {

      lastPublished = count;

      render();
    }

  }, 60000);

})();
</script>

</body>
</html>
