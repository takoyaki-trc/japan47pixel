<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveling Takoyaki Diary</title>

  <!-- 丸みのある文字 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#07203a;
      --bg2:#143a5b;
      --bg3:#0b2a47;

      --ink:#3a271e;
      --ink-soft:#725949;
      --accent:#c54a38;
      --accent-soft:#a66254;

      --paper:#f6f1e6;
      --paper-dark:#ece4d3;
      --craft:#d6b07b;
      --craft-deep:#ad7c46;
      --cover:#d7c09a;

      --shadow:0 10px 24px rgba(0,0,0,.24);
      --line-step:42px;
      --page-radius:22px;
      --button-shadow:4px 4px 0 #141414;
      --button-border:3px solid #141414;
    }

    *{box-sizing:border-box;}
    html,body{
      margin:0;
      padding:0;
      background:
        radial-gradient(circle at 50% 20%, #1f4a70 0%, #0d2c49 35%, #071c33 100%);
      color:#fff;
      font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    }

    body{
      min-height:100vh;
    }

    img{
      max-width:100%;
      display:block;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .site{
      width:min(100%, 760px);
      margin:0 auto;
      padding:18px 14px 30px;
    }

    /* ---------- header ---------- */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }

    .topbar-title{
      font-family:"Fredoka","Zen Maru Gothic",sans-serif;
      font-size:clamp(24px, 3.6vw, 32px);
      font-weight:700;
      letter-spacing:.02em;
      color:#fff2d8;
      text-transform:uppercase;
      text-shadow:0 2px 0 rgba(0,0,0,.15);
    }

    .topbar-actions{
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
    }

    .pixel-btn{
      appearance:none;
      border:var(--button-border);
      background:#f6f2e5;
      color:#222;
      padding:0 12px;
      min-width:76px;
      height:62px;
      font-family:"Zen Maru Gothic",sans-serif;
      font-size:14px;
      font-weight:800;
      line-height:1.1;
      box-shadow:var(--button-shadow);
      cursor:pointer;
      border-radius:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      white-space:nowrap;
    }

    .pixel-btn:active{
      transform:translate(2px,2px);
      box-shadow:2px 2px 0 #141414;
    }

    .pixel-btn.small-icon{
      min-width:60px;
      width:60px;
      font-size:25px;
      padding:0;
    }

    /* ---------- hero banner ---------- */
    .hero-banner{
      margin-bottom:16px;
    }

    .hero-banner img{
      width:100%;
      height:auto;
      border-radius:12px;
      object-fit:cover;
      box-shadow:0 6px 16px rgba(0,0,0,.18);
    }

    /* ---------- notebook outer ---------- */
    .notebook-shell{
      display:flex;
      align-items:stretch;
      background:linear-gradient(180deg, #e1ba7f 0%, #c58f54 100%);
      border-radius:26px;
      padding:10px;
      box-shadow:0 10px 24px rgba(0,0,0,.22);
      overflow:hidden;
      position:relative;
    }

    .ring-column{
      width:42px;
      min-width:42px;
      border-radius:18px 0 0 18px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.18) 0 26%, transparent 26% 100%),
        linear-gradient(180deg, #e7c789 0%, #c79252 100%);
      position:relative;
      box-shadow:inset -2px 0 0 rgba(255,255,255,.28);
    }

    .ring-column::before{
      content:"";
      position:absolute;
      top:12px;
      bottom:12px;
      left:10px;
      width:20px;
      background:
        repeating-linear-gradient(
          to bottom,
          #4c3828 0 12px,
          transparent 12px 44px
        );
      border-radius:8px;
      opacity:.96;
      box-shadow:
        inset -1px 0 0 rgba(255,255,255,.1),
        inset 1px 0 0 rgba(0,0,0,.12);
    }

    .page-area{
      flex:1;
      background:#f0e4ca;
      padding:14px;
      border-radius:0 18px 18px 0;
      min-width:0;
    }

    .page-panel{
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.18) 0 1px, transparent 1px 100%),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,.10) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #deceb0 0%, #d8c7a7 100%);
      background-size:18px 18px, 24px 24px, auto;
      border:2px solid rgba(119,85,51,.22);
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);
      min-height:300px;
      color:var(--ink);
      overflow:hidden;
    }

    /* ---------- cover page ---------- */
    .cover-page{
      padding:24px 22px 28px;
      position:relative;
      background:
        linear-gradient(165deg, rgba(255,255,255,.07), rgba(0,0,0,0) 35%),
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.18) 0 1px, transparent 1px 100%),
        radial-gradient(circle at 75% 30%, rgba(255,255,255,.10) 0 1px, transparent 1px 100%),
        repeating-linear-gradient(
          -18deg,
          rgba(102,74,42,.045) 0 2px,
          transparent 2px 22px
        ),
        linear-gradient(180deg, #d7c29d 0%, #d0b68b 100%);
      background-size:auto, 18px 18px, 22px 22px, auto, auto;
      min-height:640px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .cover-frame{
      border:2px solid rgba(95,62,37,.30);
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);
      padding:34px 26px 26px;
      min-height:590px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    .cover-topline{
      font-size:15px;
      font-weight:900;
      letter-spacing:.24em;
      color:#473528;
      opacity:.86;
      text-transform:uppercase;
      margin-bottom:32px;
    }

    .cover-stamp{
      display:inline-block;
      padding:8px 20px;
      border:4px solid #a65545;
      color:#a65545;
      transform:rotate(-5deg);
      font-size:19px;
      font-weight:900;
      letter-spacing:.16em;
      background:rgba(255,255,255,.08);
      margin-bottom:40px;
    }

    .cover-title{
      font-size:clamp(40px, 7vw, 68px);
      line-height:1.08;
      font-weight:900;
      color:#38261d;
      margin:0;
      letter-spacing:.02em;
    }

    .cover-subtitle{
      margin-top:24px;
      font-size:clamp(24px, 4.4vw, 36px);
      line-height:1.25;
      font-weight:900;
      color:#8b4f43;
    }

    .cover-lead{
      margin:34px auto 0;
      max-width:540px;
      font-size:clamp(17px, 3.2vw, 24px);
      line-height:1.8;
      font-weight:700;
      color:#4c382a;
    }

    .cover-open{
      margin-top:auto;
      margin-bottom:20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:260px;
      padding:22px 26px;
      background:#c94936;
      color:#fff7ee;
      border:4px solid #2b1b14;
      box-shadow:5px 5px 0 rgba(0,0,0,.30);
      font-size:clamp(22px, 4vw, 32px);
      font-weight:900;
      cursor:pointer;
      font-family:"Zen Maru Gothic",sans-serif;
    }

    .cover-open:active{
      transform:translate(2px,2px);
      box-shadow:3px 3px 0 rgba(0,0,0,.30);
    }

    .cover-foot{
      margin-top:10px;
      color:#6d5647;
      font-size:clamp(18px, 3.1vw, 24px);
      font-weight:700;
    }

    /* ---------- story page ---------- */
    .story-page{
      background:linear-gradient(180deg, #e4d8bf 0%, #ddd1b8 100%);
    }

    .photo-wrap{
      padding:28px 18px 10px;
      display:flex;
      justify-content:center;
      background:#ddd1b8;
    }

    .photo-card{
      width:min(100%, 460px);
      background:#f7f4eb;
      padding:14px 14px 18px;
      box-shadow:0 12px 24px rgba(0,0,0,.15);
      transform:rotate(-1.2deg);
      position:relative;
    }

    .photo-card::before{
      content:"";
      position:absolute;
      top:-16px;
      left:50%;
      transform:translateX(-50%);
      width:140px;
      height:24px;
      background:rgba(206,182,142,.78);
      box-shadow:0 2px 0 rgba(0,0,0,.05);
    }

    .photo-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      background:#ddd;
    }

    .photo-caption{
      text-align:center;
      color:#6b5546;
      font-weight:800;
      margin-top:12px;
      font-size:clamp(18px, 3vw, 24px);
    }

    .story-body{
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0 calc(var(--line-step) - 1px),
          rgba(115,96,77,.16) calc(var(--line-step) - 1px) var(--line-step)
        ),
        linear-gradient(180deg, #f7f3ea 0%, #f3efe5 100%);
      padding:18px 18px 28px;
      border-top:1px solid rgba(80,50,20,.08);
    }

    .story-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:#7b6551;
      font-size:clamp(14px, 2.8vw, 20px);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.03em;
      margin-bottom:8px;
    }

    .story-title{
      color:#37261d;
      font-size:clamp(31px, 6vw, 52px);
      font-weight:900;
      line-height:1.2;
      margin:10px 0 18px;
      letter-spacing:.01em;
    }

    .story-accent{
      width:116px;
      height:8px;
      background:#c44b38;
      margin-bottom:14px;
    }

    .story-lines{
      margin-top:0;
    }

    .text-line{
      min-height:var(--line-step);
      display:flex;
      align-items:center;
      color:#3d2b21;
      font-size:clamp(18px, 3.65vw, 31px);
      line-height:1;
      font-weight:700;
      white-space:normal;
      word-break:keep-all;
    }

    .text-line.em{
      color:#9e4f42;
      font-weight:900;
    }

    .story-bottom-meta{
      margin-top:8px;
      padding-top:10px;
      border-top:2px solid rgba(100,78,56,.22);
      display:flex;
      justify-content:space-between;
      gap:10px;
      color:#7f6a57;
      font-size:clamp(13px, 2.7vw, 19px);
      font-weight:800;
    }

    /* ---------- pager ---------- */
    .pager{
      margin-top:16px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
    }

    .pager-center{
      text-align:center;
      color:#f5e6c9;
      font-weight:800;
      font-size:14px;
      line-height:1.45;
    }

    .nav-btn{
      appearance:none;
      border:3px solid #806342;
      background:linear-gradient(180deg, #f3ead8 0%, #eaddc6 100%);
      box-shadow:0 5px 14px rgba(0,0,0,.20), inset 0 0 0 2px rgba(255,255,255,.24);
      color:#39281d;
      border-radius:10px;
      padding:18px 10px;
      font-size:clamp(18px, 3.2vw, 22px);
      font-weight:900;
      font-family:"Zen Maru Gothic",sans-serif;
      cursor:pointer;
      min-height:76px;
    }

    .nav-btn:disabled{
      opacity:.45;
      cursor:default;
    }

    footer.site-foot{
      margin-top:20px;
      text-align:center;
      color:#f7ead3;
    }

    .foot-main{
      font-family:"Fredoka","Zen Maru Gothic",sans-serif;
      font-weight:600;
      font-size:clamp(18px, 3.2vw, 24px);
      line-height:1.55;
      text-transform:uppercase;
      letter-spacing:.02em;
      margin-bottom:10px;
    }

    .foot-sub{
      font-size:clamp(14px, 2.8vw, 18px);
      line-height:1.8;
      color:#efe0c3;
      opacity:.95;
    }

    /* ---------- TOC modal ---------- */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(100%, 560px);
      max-height:84vh;
      overflow:auto;
      background:#f6efdf;
      color:#33241a;
      border:4px solid #1d1d1d;
      box-shadow:8px 8px 0 #111;
      padding:18px;
    }

    .modal-title{
      margin:0 0 14px;
      font-size:26px;
      font-weight:900;
    }

    .toc-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .toc-item{
      width:100%;
      text-align:left;
      background:#fffaf1;
      border:3px solid #241d18;
      padding:14px 14px;
      font-size:18px;
      font-weight:800;
      font-family:"Zen Maru Gothic",sans-serif;
      cursor:pointer;
    }

    .toc-close{
      margin-top:14px;
      width:100%;
    }

    /* ---------- responsive ---------- */
    @media (max-width:520px){
      .site{padding:14px 12px 28px;}
      .topbar{align-items:flex-start;}
      .topbar-title{
        font-size:18px;
        line-height:1.2;
        margin-top:10px;
      }
      .topbar-actions{
        gap:6px;
      }
      .pixel-btn{
        min-width:74px;
        height:58px;
        font-size:13px;
        padding:0 10px;
      }
      .pixel-btn.small-icon{
        width:56px;
        min-width:56px;
        font-size:24px;
      }
      .cover-frame{
        min-height:540px;
        padding:26px 18px 24px;
      }
      .cover-open{
        min-width:210px;
        padding:18px 18px;
      }
      .story-body{padding:16px 14px 24px;}
      .story-title{margin-top:8px;}
      .pager{
        grid-template-columns:1fr 1fr;
      }
      .pager-center{
        grid-column:1 / -1;
        order:3;
      }
    }
  </style>
</head>
<body>
  <div class="site">
    <header class="topbar">
      <div class="topbar-title" id="siteTitle">TRAVEL DIARY</div>

      <div class="topbar-actions">
        <button class="pixel-btn" id="tocBtn">目次</button>
        <button class="pixel-btn" id="langBtn">ENGLISH</button>
        <a class="pixel-btn small-icon" href="https://japan47pixel.net/" aria-label="home">⌂</a>
      </div>
    </header>

    <!-- カバー画像は横いっぱい、枠なし -->
    <section class="hero-banner">
      <img src="./images/diary-banner.png" alt="Traveling Takoyaki banner">
    </section>

    <main id="pageMount"></main>

    <nav class="pager">
      <button class="nav-btn" id="prevBtn">← 前へ</button>
      <div class="pager-center" id="pageStatus"></div>
      <button class="nav-btn" id="nextBtn">次へ →</button>
    </nav>

    <footer class="site-foot">
      <div class="foot-main" id="footerMain">ONE TAKOYAKI. 47 PREFECTURES. AN IMPOSSIBLE ROAD TRIP. 🐙🚚</div>
      <div class="foot-sub" id="footerSub">© TRAVELING TAKOYAKI · Fictional story · A new chapter every 2 days</div>
    </footer>
  </div>

  <div class="modal" id="tocModal">
    <div class="modal-card">
      <h2 class="modal-title" id="tocTitle">目次</h2>
      <div class="toc-list" id="tocList"></div>
      <button class="pixel-btn toc-close" id="tocClose">CLOSE</button>
    </div>
  </div>

  <script>
    const diaryPages = [
      {
        id: "cover",
        type: "cover",
        labelJa: "カバー",
        labelEn: "Cover",
        topLineJa: "旅するたこ焼き・JAPAN 47",
        topLineEn: "TRAVELING TAKOYAKI · JAPAN 47",
        stampJa: "北海道・01 / 47",
        stampEn: "HOKKAIDO · 01 / 47",
        titleJa: "たこ焼き\n旅行記",
        titleEn: "TAKOYAKI\nTRAVEL DIARY",
        subtitleJa: "鉄板の向こう側へ",
        subtitleEn: "Beyond the Iron Plate",
        leadJa: "毎日焼かれて食べられる人生を抜け出し、ひとつのたこ焼きが旅に出た。",
        leadEn: "Escaping a life of being cooked and eaten every day, one takoyaki begins a journey.",
        openTextJa: "日記を開く →",
        openTextEn: "OPEN DIARY →",
        footJa: "北海道・全12章",
        footEn: "Hokkaido · 12 chapters"
      },
      {
        id: "prologue-00",
        type: "story",
        labelJa: "プロローグ",
        labelEn: "Prologue",
        chapterJa: "PROLOGUE 00",
        chapterEn: "PROLOGUE 00",
        metaRightJa: "01 / 47 ・ 北海道",
        metaRightEn: "01 / 47 · HOKKAIDO",
        titleJa: "鉄板の向こう側",
        titleEn: "Beyond the Iron Plate",
        image: "./images/prologue-takoyaki-griddle.png",
        imageCaptionJa: "旅の前に",
        imageCaptionEn: "Before the Journey",
        linesJa: [
          "毎日、鉄板の上で焼かれる。",
          "くるくるひっくり返されて、ソースを塗られて、",
          "最後は誰かのお腹の中へ。",
          "それが、たこ焼きの人生だった。",
          "でも、ある日、ひとつのたこ焼きが思った。",
          "「もっと広い世界を旅したい。」",
          "そして次の瞬間——ぽーーーーん！",
          "鉄板から飛び出した。自由だ！",
          "……着地した先は、たこ焼きカーの屋根だった。",
          "「結局、たこ焼き屋からは逃げられないのか。」",
          "それでもエンジンは動き出した。",
          "最初の目的地は、北海道。"
        ],
        linesEn: [
          "Every day, it was cooked on the iron plate.",
          "Flipped and turned, brushed with sauce,",
          "and finally sent into someone’s stomach.",
          "That was the life of a takoyaki.",
          "But one day, one takoyaki had a thought.",
          "\"I want to see a bigger world.\"",
          "Then, in the very next instant—boiiing!",
          "It jumped off the iron plate. Freedom!",
          "…and landed on the roof of the takoyaki truck.",
          "\"So I still couldn't escape the takoyaki life?\"",
          "Even so, the engine began to move.",
          "The first destination: Hokkaido."
        ],
        emphasisJa: [11],
        emphasisEn: [11],
        footerLeftJa: "TRAVELING TAKOYAKI",
        footerLeftEn: "TRAVELING TAKOYAKI",
        footerRightJa: "00",
        footerRightEn: "00"
      },
      {
        id: "chapter-01",
        type: "story",
        labelJa: "第1話",
        labelEn: "Chapter 01",
        chapterJa: "CHAPTER 01 / 12",
        chapterEn: "CHAPTER 01 / 12",
        metaRightJa: "11月1日 00:00 JST",
        metaRightEn: "Nov 1, 00:00 JST",
        titleJa: "牛に人生相談をしてみた。",
        titleEn: "I Asked a Cow for Life Advice.",
        image: "./images/hokkaido-farm.png",
        imageCaptionJa: "北海道・牧場",
        imageCaptionEn: "Hokkaido · Farm",
        linesJa: [
          "鉄板を飛び出して、はじめてたどり着いたのは北海道。",
          "空が広い。草も広い。牛も、やたら落ち着いている。",
          "たこ焼きは思わず、近くの牛に話しかけた。",
          "「はじめまして。旅をしているたこ焼きです。」",
          "牛は、もぐもぐしながらこちらを見た。",
          "「そう。」",
          "会話が短い。でも、なんだか深い。",
          "たこ焼きは続けた。",
          "「ぼくは、これから47都道府県を旅します。」",
          "「へえ。」",
          "「どうしたら立派なたこ焼きになれますか？」",
          "牛は少しだけ考えて、こう言った。",
          "「急がないこと。」",
          "たこ焼きは、そのひと言に妙に納得してしまった。"
        ],
        linesEn: [
          "After leaping from the iron plate,",
          "the first place it reached was Hokkaido.",
          "The sky was wide. The grass was endless.",
          "Even the cows looked incredibly calm.",
          "So the takoyaki spoke to a nearby cow.",
          "\"Hello. I'm a traveling takoyaki.\"",
          "The cow kept chewing and looked over.",
          "\"I see.\"",
          "A short answer. Yet somehow profound.",
          "The takoyaki continued,",
          "\"I'm going to travel all 47 prefectures.\"",
          "\"Hmm.\"",
          "\"How can I become a great takoyaki?\"",
          "The cow thought for a moment and said:",
          "\"Don't rush.\""
        ],
        emphasisJa: [],
        emphasisEn: [],
        footerLeftJa: "TRAVELING TAKOYAKI",
        footerLeftEn: "TRAVELING TAKOYAKI",
        footerRightJa: "01",
        footerRightEn: "01"
      }
    ];

    let currentLang = "ja";
    let currentIndex = 0;

    const pageMount = document.getElementById("pageMount");
    const siteTitle = document.getElementById("siteTitle");
    const footerMain = document.getElementById("footerMain");
    const footerSub = document.getElementById("footerSub");
    const tocBtn = document.getElementById("tocBtn");
    const langBtn = document.getElementById("langBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageStatus = document.getElementById("pageStatus");

    const tocModal = document.getElementById("tocModal");
    const tocTitle = document.getElementById("tocTitle");
    const tocList = document.getElementById("tocList");
    const tocClose = document.getElementById("tocClose");

    function t(ja, en){
      return currentLang === "ja" ? ja : en;
    }

    function makeLineClass(index, emphasisList){
      return emphasisList.includes(index) ? "text-line em" : "text-line";
    }

    function renderCover(page){
      return `
        <section class="notebook-shell">
          <div class="ring-column"></div>
          <div class="page-area">
            <div class="page-panel cover-page">
              <div class="cover-frame">
                <div class="cover-topline">${currentLang === "ja" ? page.topLineJa : page.topLineEn}</div>
                <div class="cover-stamp">${currentLang === "ja" ? page.stampJa : page.stampEn}</div>

                <h1 class="cover-title">
                  ${(currentLang === "ja" ? page.titleJa : page.titleEn).replace(/\n/g, "<br>")}
                </h1>

                <div class="cover-subtitle">${currentLang === "ja" ? page.subtitleJa : page.subtitleEn}</div>
                <div class="cover-lead">${currentLang === "ja" ? page.leadJa : page.leadEn}</div>

                <button class="cover-open" onclick="goToPage(1)">
                  ${currentLang === "ja" ? page.openTextJa : page.openTextEn}
                </button>

                <div class="cover-foot">${currentLang === "ja" ? page.footJa : page.footEn}</div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderStory(page){
      const lines = currentLang === "ja" ? page.linesJa : page.linesEn;
      const emphasis = currentLang === "ja" ? page.emphasisJa : page.emphasisEn;

      return `
        <section class="notebook-shell">
          <div class="ring-column"></div>

          <div class="page-area">
            <div class="page-panel story-page">
              <div class="photo-wrap">
                <div class="photo-card">
                  <img src="${page.image}" alt="${currentLang === "ja" ? page.imageCaptionJa : page.imageCaptionEn}">
                  <div class="photo-caption">${currentLang === "ja" ? page.imageCaptionJa : page.imageCaptionEn}</div>
                </div>
              </div>

              <div class="story-body">
                <div class="story-head">
                  <div>${currentLang === "ja" ? page.chapterJa : page.chapterEn}</div>
                  <div>${currentLang === "ja" ? page.metaRightJa : page.metaRightEn}</div>
                </div>

                <div class="story-title">${currentLang === "ja" ? page.titleJa : page.titleEn}</div>
                <div class="story-accent"></div>

                <div class="story-lines">
                  ${lines.map((line, i) => `
                    <div class="${makeLineClass(i, emphasis)}">${line}</div>
                  `).join("")}
                </div>

                <div class="story-bottom-meta">
                  <div>${currentLang === "ja" ? page.footerLeftJa : page.footerLeftEn}</div>
                  <div>${currentLang === "ja" ? page.footerRightJa : page.footerRightEn}</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderPage(){
      const page = diaryPages[currentIndex];

      pageMount.innerHTML = page.type === "cover"
        ? renderCover(page)
        : renderStory(page);

      siteTitle.textContent = currentLang === "ja" ? "旅行記" : "TRAVEL DIARY";
      tocBtn.textContent = currentLang === "ja" ? "目次" : "TOC";
      langBtn.textContent = currentLang === "ja" ? "ENGLISH" : "日本語";

      prevBtn.textContent = currentLang === "ja" ? "← 前へ" : "← PREV";
      nextBtn.textContent = currentLang === "ja" ? "次へ →" : "NEXT →";

      footerMain.textContent = "ONE TAKOYAKI. 47 PREFECTURES. AN IMPOSSIBLE ROAD TRIP. 🐙🚚";
      footerSub.textContent = currentLang === "ja"
        ? "© TRAVELING TAKOYAKI ・ Fictional story ・ 2日おきに新しいページが開きます"
        : "© TRAVELING TAKOYAKI · Fictional story · A new chapter opens every 2 days";

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === diaryPages.length - 1;

      pageStatus.innerHTML = `
        <div>${currentLang === "ja" ? diaryPages[currentIndex].labelJa : diaryPages[currentIndex].labelEn}</div>
        <div style="opacity:.9;">
          ${currentLang === "ja"
            ? "北海道編・2日おき更新"
            : "Hokkaido arc · Updates every 2 days"}
        </div>
      `;
    }

    function renderTOC(){
      tocTitle.textContent = currentLang === "ja" ? "目次" : "Table of Contents";
      tocClose.textContent = currentLang === "ja" ? "閉じる" : "CLOSE";

      tocList.innerHTML = diaryPages.map((page, index) => `
        <button class="toc-item" onclick="selectFromToc(${index})">
          ${currentLang === "ja" ? page.labelJa : page.labelEn}
        </button>
      `).join("");
    }

    function goToPage(index){
      currentIndex = index;
      renderPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectFromToc(index){
      currentIndex = index;
      tocModal.classList.remove("show");
      renderPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleLang(){
      currentLang = currentLang === "ja" ? "en" : "ja";
      renderPage();
      renderTOC();
    }

    prevBtn.addEventListener("click", () => {
      if(currentIndex > 0){
        currentIndex--;
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    nextBtn.addEventListener("click", () => {
      if(currentIndex < diaryPages.length - 1){
        currentIndex++;
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    tocBtn.addEventListener("click", () => {
      renderTOC();
      tocModal.classList.add("show");
    });

    tocClose.addEventListener("click", () => {
      tocModal.classList.remove("show");
    });

    tocModal.addEventListener("click", (e) => {
      if(e.target === tocModal){
        tocModal.classList.remove("show");
      }
    });

    langBtn.addEventListener("click", toggleLang);

    renderPage();
    renderTOC();

    // グローバル公開（インライン onclick 用）
    window.goToPage = goToPage;
    window.selectFromToc = selectFromToc;
  </script>
</body>
</html>
