
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11283b">

<title>TRAVEL DIARY | TRAVELING TAKOYAKI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Old+Mincho:wght@400;600;700;900&display=swap');

:root {
  --navy: #11283b;
  --ink: #332619;
  --brown: #7d5232;
  --cream: #fff9ed;
  --kraft: #d4ad79;
  --red: #b84132;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(
    ellipse at 50% 0%,
    #2d4f68 0%,
    #11283b 60%,
    #071521 100%
  );
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
}

button {
  cursor: pointer;
  font: inherit;
}

button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #f8cb62;
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

/* =========================================
   HEADER
========================================= */

.header {
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 13px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.logo-text {
  font-size: 17px;
  font-weight: 900;
  color: #fff4dc;
  letter-spacing: .02em;
  white-space: nowrap;
}

.header-buttons {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.header-btn {
  height: 40px;
  min-width: 45px;
  padding: 0 12px;
  background: #fffaf0;
  color: #171717;
  border: 2px solid #0b0e13;
  border-radius: 0;
  box-shadow: 4px 4px 0 #071420;
  text-decoration: none;
  font-family: Georgia, 'Noto Sans JP', sans-serif;
  font-size: 12px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}

.header-btn:hover {
  background: #f1deb5;
}

#languageBtn {
  min-width: 82px;
}

.home-btn {
  font-size: 25px;
  line-height: 1;
}

/* =========================================
   MAIN / HERO
========================================= */

.main {
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 0 12px;
}

.hero {
  position: relative;
  border: 4px solid #e0b864;
  border-radius: 7px;
  background: linear-gradient(
    #4daddd,
    #b7e4f1 60%,
    #72a66b 61%,
    #3d6e51 84%,
    #394354 85%
  );
  box-shadow: 4px 5px 0 #071521;
  overflow: hidden;
  min-height: 135px;
}

.hero img {
  display: none;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
}

.hero.has-image img {
  display: block;
}

.hero.has-image .hero-fallback {
  display: none;
}

.hero-fallback {
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  text-align: center;
  color: #14283d;
  padding: 20px;
}

.hero-fallback strong {
  font-size: clamp(25px, 5vw, 48px);
  font-weight: 900;
  line-height: 1.15;
  text-shadow: 2px 2px #fff;
}

.hero-fallback span {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .2em;
}

/* =========================================
   NOTEBOOK
========================================= */

.notebook {
  margin-top: 22px;
  margin-bottom: 16px;
  padding: 13px 13px 13px 42px;
  position: relative;

  border: 7px solid #86532f;
  border-radius: 18px;

  background: linear-gradient(
    135deg,
    #e7c28b,
    #c7965d
  );

  box-shadow:
    0 15px 35px #0007,
    inset 0 0 0 4px #f0d3a1;
}

/* スクリーンショットのような
   四角く独立したリング穴 */

.notebook::before {
  content: "";
  position: absolute;
  top: 20px;
  bottom: 20px;
  left: 13px;
  width: 17px;

  background: repeating-linear-gradient(
    to bottom,
    #59422c 0 13px,
    #e8c995 13px 36px
  );

  box-shadow:
    inset 2px 1px 2px #26170d88,
    1px 0 0 #f5dcae;
}

.page {
  min-height: 560px;
  background: var(--cream);
  overflow: hidden;
  border-radius: 2px;
}

.page.flipping {
  animation: flip .35s ease-out;
}

@keyframes flip {
  0% {
    opacity: .55;
    transform: perspective(1200px) rotateY(-6deg);
  }
  100% {
    opacity: 1;
    transform: perspective(1200px) rotateY(0);
  }
}

/* =========================================
   CRAFT COVER
========================================= */

.cover {
  min-height: 610px;
  padding: 43px 28px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;

  text-align: center;
  position: relative;

  background-color: #d7b183;
  background-image:
    radial-gradient(
      #80593730 1px,
      transparent 1px
    ),
    repeating-linear-gradient(
      10deg,
      transparent 0 12px,
      #80563712 13px 14px,
      transparent 15px 26px
    ),
    linear-gradient(
      150deg,
      #e7cca6 0%,
      #d3ad79 55%,
      #c19666 100%
    );

  background-size:
    15px 17px,
    auto,
    auto;
}

.cover::before {
  content: "";
  position: absolute;
  inset: 17px;
  border: 3px double #725237;
  pointer-events: none;
}

.cover-content {
  position: relative;
  z-index: 1;
  max-width: 660px;
  width: 100%;
}

.cover-small {
  font-weight: 900;
  font-size: clamp(11px, 2.4vw, 17px);
  letter-spacing: .18em;
  color: #4c3625;
}

.cover-decoration {
  margin: 15px auto 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #6b5036;
}

.cover-decoration::before,
.cover-decoration::after {
  content: "";
  display: block;
  width: 25%;
  height: 1px;
  background: #694c34;
}

.stamp {
  display: inline-block;
  border: 3px solid #a53d2e;
  padding: 8px 18px;
  color: #a53d2e;
  font-size: clamp(13px, 3.6vw, 23px);
  font-weight: 900;
  letter-spacing: .13em;
  transform: rotate(-5deg);
  margin-bottom: 27px;
}

.cover-title {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: clamp(36px, 8.5vw, 79px);
  font-weight: 900;
  line-height: 1.12;
  letter-spacing: -.05em;
  color: #302114;
  margin: 0;
}

.cover-title span {
  display: block;
}

.cover-subtitle {
  border-top: 2px solid #805a39;
  margin: 24px auto 0;
  padding-top: 15px;
  width: 88%;
  color: #a53d2e;
  font-size: clamp(17px, 4vw, 27px);
  font-weight: 900;
}

.cover-description {
  max-width: 510px;
  margin: 23px auto;
  font-family: 'Zen Old Mincho', serif;
  font-weight: 600;
  font-size: clamp(14px, 3.5vw, 19px);
  line-height: 1.9;
}

.open-btn {
  margin: 19px auto 0;
  border: 3px solid #3d241d;
  background: #c54835;
  color: white;
  padding: 13px 27px;
  font-size: 19px;
  font-weight: 900;
  box-shadow: 5px 5px 0 #573b2b;
}

.open-btn:hover {
  background: #a83527;
}

.cover-bottom {
  margin-top: 32px;
  font-size: 13px;
  font-weight: 700;
  color: #63482c;
  letter-spacing: .08em;
}

/* =========================================
   DIARY PAGES
========================================= */

.diary-spread {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 590px;
}

.image-side {
  min-width: 0;
  padding: 28px 22px;
  background: #ecddc1;
  border-right: 1px solid #bea27a;

  display: flex;
  flex-direction: column;
}

.chapter-label {
  color: #886547;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .12em;
  margin-bottom: 26px;
}

.photo {
  margin: auto;
  width: min(100%, 440px);
  padding: 12px 12px 24px;

  position: relative;
  background: #fffaf0;
  box-shadow: 3px 8px 18px #4b382b50;
  transform: rotate(-1deg);
}

.photo::before {
  content: "";
  position: absolute;
  width: 80px;
  height: 24px;
  top: -12px;
  left: calc(50% - 40px);
  background: #c3a16a9c;
  transform: rotate(3deg);
  z-index: 2;
}

.photo img {
  display: none;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  image-rendering: pixelated;
}

.photo.has-image img {
  display: block;
}

.photo-placeholder {
  aspect-ratio: 1;
  background: linear-gradient(
    160deg,
    #b6d9dd,
    #7da29c 57%,
    #718367 58%,
    #56724f
  );
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  text-align: center;
  color: #fff;
  font-weight: 900;
  text-shadow: 1px 2px 3px #324d51;
}

.photo.has-image .photo-placeholder {
  display: none;
}

.photo figcaption {
  margin-top: 15px;
  font-size: 12px;
  color: #745a41;
  text-align: center;
  font-weight: 700;
}

.text-side {
  min-width: 0;
  padding: 30px 29px 17px 36px;
  background: repeating-linear-gradient(
    to bottom,
    #fffaf0 0 33px,
    #cabda766 34px,
    #fffaf0 35px
  );

  display: flex;
  flex-direction: column;
}

.page-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #8b6c4d;
  font-size: 11px;
  font-weight: 900;
}

.diary-title {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.32;
  font-weight: 900;
  margin: 24px 0 15px;
  color: #33251b;
}

.title-rule {
  width: 68px;
  height: 5px;
  background: #c44837;
  margin-bottom: 23px;
}

.diary-text {
  font-family: 'Zen Old Mincho', serif;
  font-size: 16px;
  line-height: 2.05;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.diary-text p {
  margin: 0 0 12px;
}

.diary-text p:last-child {
  color: #9e4132;
  font-weight: 900;
}

.page-footer {
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid #bdad94;
  color: #796751;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-family: Georgia, serif;
  font-size: 11px;
}

/* =========================================
   PAGE NAVIGATION
========================================= */

.page-navigation {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
  margin: 20px 0;
}

.page-nav-button {
  min-height: 51px;
  padding: 10px;
  color: #352719;
  background: #f4e3c5;
  border: 2px solid #bda17b;
  border-radius: 5px;
  box-shadow: 3px 3px 0 #071521;
  font-weight: 900;
  font-size: 13px;
}

.page-nav-button:last-child {
  justify-self: end;
}

.page-progress {
  color: #f7e9d2;
  text-align: center;
  font-size: 12px;
  line-height: 1.7;
}

.next-release {
  display: block;
  font-size: 10px;
  color: #d8c3a3;
}

/* =========================================
   REACTIONS
========================================= */

.reaction-section {
  background: #f4e6ca;
  border: 5px solid #987149;
  border-radius: 9px;
  padding: 20px;
  margin: 0 0 25px;
}

.reaction-heading {
  font-size: 14px;
  font-weight: 900;
  color: #604630;
  margin: 0 0 15px;
  letter-spacing: .05em;
}

.reaction-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.reaction-button {
  padding: 13px 6px;
  border: 2px solid #cbb18c;
  background: #fffaf0;
  border-radius: 8px;
  color: #372a20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.reaction-button .emoji {
  font-size: 27px;
}

.reaction-button .count {
  font-family: Georgia, serif;
  font-size: 15px;
  font-weight: 900;
}

.reaction-button.selected {
  border-color: #b84a36;
  background: #ffe2d5;
  box-shadow: inset 0 0 0 1px #b84a36;
}

.reaction-message {
  text-align: center;
  color: #82654c;
  font-size: 12px;
  line-height: 1.7;
  margin: 12px 0 0;
}

/* =========================================
   TABLE OF CONTENTS
========================================= */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  padding: 16px;
  background: #071521eb;

  display: none;
  justify-content: center;
  align-items: center;
}

.modal.open {
  display: flex;
}

.modal-panel {
  background: #faedd7;
  border: 6px solid #835937;
  border-radius: 8px;
  padding: 18px;
  max-width: 760px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 1px solid #c5a882;
}

.modal-heading h2 {
  font-size: 20px;
  margin: 0;
}

.close-btn {
  background: #c44837;
  border: 0;
  color: white;
  padding: 8px 13px;
  font-weight: 900;
}

.chapter-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-top: 15px;
}

.chapter-item {
  border: 1px solid #d0b28e;
  background: #fffaf1;
  color: #3d2b1c;
  padding: 10px;
  text-align: left;
  min-height: 75px;
}

.chapter-item strong {
  display: block;
  font-size: 13px;
  line-height: 1.6;
}

.chapter-item small {
  display: block;
  color: #8a684b;
  font-size: 11px;
}

.chapter-item.locked {
  background: #e9dcc7;
  opacity: .7;
}

.copyright {
  color: #d7c7b0;
  text-align: center;
  font-size: 11px;
  padding: 15px 0 35px;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 760px) {

  .header {
    padding: 11px 9px;
  }

  .logo-text {
    font-size: 13px;
  }

  .header-buttons {
    gap: 5px;
  }

  .header-btn {
    height: 37px;
    min-width: 38px;
    padding: 0 8px;
    font-size: 11px;
    box-shadow: 3px 3px 0 #071420;
  }

  #languageBtn {
    min-width: 70px;
  }

  .main {
    padding: 0 9px;
  }

  .hero {
    border-width: 3px;
    min-height: 110px;
  }

  .hero-fallback {
    min-height: 130px;
  }

  .notebook {
    padding: 10px 10px 10px 35px;
    border-width: 6px;
    margin-top: 16px;
  }

  .notebook::before {
    left: 9px;
    width: 14px;
    top: 17px;
    bottom: 17px;
    background: repeating-linear-gradient(
      to bottom,
      #59422c 0 12px,
      #e8c995 12px 34px
    );
  }

  .page {
    min-height: 0;
  }

  .cover {
    min-height: 550px;
    padding: 44px 19px;
  }

  .cover::before {
    inset: 12px;
  }

  .cover-description {
    font-size: 15px;
  }

  .diary-spread {
    display: block;
    min-height: 0;
  }

  .image-side {
    padding: 19px 17px;
    border-right: none;
  }

  .chapter-label {
    margin-bottom: 16px;
  }

  .photo {
    width: min(88%, 420px);
  }

  .text-side {
    padding: 27px 19px 17px;
    min-height: 380px;
  }

  .diary-title {
    font-size: 26px;
  }

  .diary-text {
    font-size: 16px;
    line-height: 2.1;
  }

  .page-nav-button {
    font-size: 12px;
    min-height: 48px;
    padding: 8px;
  }

  .page-progress {
    font-size: 11px;
  }

  .next-release {
    font-size: 10px;
  }

  .chapter-list {
    grid-template-columns: 1fr;
  }

  .reaction-section {
    padding: 14px;
  }
}

@media (max-width: 370px) {
  .logo-text {
    font-size: 11px;
  }

  .header-btn {
    padding: 0 6px;
    font-size: 10px;
  }

  #languageBtn {
    min-width: 63px;
  }

  .notebook {
    padding-left: 30px;
  }

  .cover-title {
    font-size: 34px;
  }

  .page-navigation {
    gap: 5px;
  }

  .page-nav-button {
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .page.flipping {
    animation: none;
  }

  html {
    scroll-behavior: auto;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo-text">TRAVEL DIARY</div>

  <nav class="header-buttons">
    <button
      class="header-btn"
      id="indexBtn"
      type="button">INDEX</button>

    <button
      class="header-btn"
      id="languageBtn"
      type="button">日本語</button>

    <a
      class="header-btn home-btn"
      href="https://japan47pixel.net/"
      aria-label="Official site"
      title="Official site">⌂</a>
  </nav>
</header>

<main class="main">

  <section class="hero" id="hero">
    <img
      id="heroImage"
      src="./assets/cover.png"
      alt="TRAVELING TAKOYAKI">

    <div class="hero-fallback">
      <strong>TRAVELING TAKOYAKI</strong>
      <span>JAPAN 47 JOURNEY</span>
    </div>
  </section>

  <section class="notebook" id="notebook">
    <div class="page" id="page">

      <!-- JavaScriptが使えない場合も表紙を表示 -->
      <div class="cover">
        <div class="cover-content">
          <div class="cover-small">
            TRAVELING TAKOYAKI · JAPAN 47
          </div>
          <h1 class="cover-title">
            <span>TRAVEL</span>
            <span>DIARY</span>
          </h1>
          <p class="cover-description">
            One takoyaki. Forty-seven prefectures.
            An unexpected journey.
          </p>
        </div>
      </div>

    </div>
  </section>

  <nav class="page-navigation">
    <button
      type="button"
      class="page-nav-button"
      id="prevBtn">← PREVIOUS</button>

    <div class="page-progress">
      <span id="pageIndicator">COVER</span>
      <span class="next-release" id="nextRelease"></span>
    </div>

    <button
      type="button"
      class="page-nav-button"
      id="nextBtn">NEXT →</button>
  </nav>

  <section
    id="reactionArea"
    class="reaction-section"
    hidden></section>

</main>

<footer class="copyright">
  © TRAVELING TAKOYAKI
</footer>

<div class="modal" id="indexModal"
     role="dialog" aria-modal="true"
     aria-labelledby="indexTitle">
  <div class="modal-panel">

    <div class="modal-heading">
      <h2 id="indexTitle">INDEX</h2>

      <button
        class="close-btn"
        type="button"
        id="closeIndex">×</button>
    </div>

    <div class="chapter-list" id="chapterList"></div>

  </div>
</div>

<script>
/* ============================================
   TRAVELING TAKOYAKI
   JOURNEY DIARY ENGINE

   This script works without Firebase.
============================================ */

(function () {
  "use strict";

  const FIRST_RELEASE =
    "2026-11-01T00:00:00+09:00";

  const SECOND_RELEASE =
    "2026-11-03T10:00:00+09:00";

  const INTERVAL_DAYS = 2;

  const prologue = {
    ja: [
      "毎日、鉄板の上で焼かれる。",
      "くるくるひっくり返されて、ソースを塗られて、最後は誰かのお腹の中へ。",
      "それが、たこ焼きの人生だった。",
      "でも、ある日、ひとつのたこ焼きが思った。",
      "「もっと広い世界を旅したい。」",
      "そして次の瞬間——ぽーーーーん！",
      "鉄板から飛び出した。自由だ！",
      "……着地した先は、たこ焼きカーの屋根だった。",
      "「結局、たこ焼き屋からは逃げられないのか。」",
      "それでもエンジンは動き出した。",
      "最初の目的地は、北海道。"
    ],
    en: [
      "Every day, the same hot griddle.",
      "Flip. Sauce. Seaweed flakes. Then straight into somebody’s stomach.",
      "That was the entire life of a takoyaki.",
      "Until one day, a single takoyaki had a thought.",
      "“I want to see the world beyond this griddle.”",
      "And then—BOING!",
      "It launched itself into freedom.",
      "…And landed on top of a takoyaki truck.",
      "“So much for escaping the food industry.”",
      "Still, the engine started.",
      "First destination: HOKKAIDO."
    ]
  };

  const chapters = [
    {
      id: 1,
      jaTitle: "牛に人生相談をしてみた。",

  const $ = id => document.getElementById(id);

  const escapeText = text =>
    String(text ?? "").replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character])
    );

  const pad = n => String(n).padStart(2, "0");

  chapters.forEach((chapter, index) => {
    chapter.key = "hokkaido-" + pad(chapter.id);

    chapter.image =
      "./assets/hokkaido-" + pad(chapter.id) + ".png";

    chapter.release = index === 0
      ? FIRST_RELEASE
      : new Date(
          Date.parse(SECOND_RELEASE) +
          (index - 1) * INTERVAL_DAYS * 86400000
        ).toISOString();
  });

  let language = "en";

  try {
    language =
      localStorage.getItem("travel-diary-language") === "ja"
        ? "ja"
        : "en";
  } catch (_) {}

  let currentPage = 0;
  let reactionSequence = 0;

  function isOpen(chapter) {
    return Date.now() >= Date.parse(chapter.release);
  }

  function openCount() {
    return chapters.filter(isOpen).length;
  }

  function maxPage() {
    return openCount() + 1;
  }

  function formatDate(iso) {
    return new Intl.DateTimeFormat(
      language === "ja" ? "ja-JP" : "en-GB",
      {
        timeZone: "Asia/Tokyo",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).format(new Date(iso)) + " JST";
  }

  function paragraphs(lines) {
    return lines.map(line =>
      "<p>" + escapeText(line) + "</p>"
    ).join("");
  }

  function titleFor(chapter) {
    return language === "ja"
      ? chapter.jaTitle
      : chapter.enTitle;
  }

  function placeFor(chapter) {
    return language === "ja"
      ? chapter.jaPlace
      : chapter.enPlace;
  }

  function setupImages() {

    const heroImage = $("heroImage");
    const hero = $("hero");

    const onHeroLoad = () => {
      if (heroImage.naturalWidth > 0) {
        hero.classList.add("has-image");
      }
    };

    heroImage.addEventListener("load", onHeroLoad);

    if (heroImage.complete) {
      onHeroLoad();
    }

    // 画像が見つからなくても本文を残す
    document.querySelectorAll(".photo").forEach(figure => {
      const image = figure.querySelector("img");

      if (!image) return;

      function check() {
        if (image.naturalWidth > 0) {
          figure.classList.add("has-image");
        }
      }

      image.addEventListener("load", check);

      if (image.complete) check();
    });
  }

  function renderCover() {
    const english = language === "en";

    $("page").innerHTML = `
      <article class="cover">

              ? "HOKKAIDO · 01 / 47"
              : "北海道 · 01 / 47"}
          </div>

          <h1 class="cover-title">

              ? "<span>TRAVEL</span><span>DIARY</span>"
              : "<span>たこ焼きの</span><span>旅日記</span>"}

          <div class="cover-subtitle">
            ${english
              ? "BEYOND THE GRIDDLE"

    `;

    $("openDiary").addEventListener("click", () => {
      goTo(1);

  function renderStory() {

    const intro = currentPage === 1;
    const chapter = intro ? null : chapters[currentPage - 2];

    if (chapter && !isOpen(chapter)) {
      currentPage = maxPage();
      render();
      return;
    }

    const title = intro
      ? (language === "ja"
          ? "鉄板の向こう側"
          : "Beyond the Griddle")
      : titleFor(chapter);

    const place = intro
      ? (language === "ja"
          ? "旅のはじまり"
          : "Before the Journey")
      : placeFor(chapter);

    const label = intro
      ? "PROLOGUE 00"
      : "CHAPTER " + pad(chapter.id) + " / 12";

    const text = intro
      ? prologue[language]
      : chapter[language];

    const image = intro
      ? "./assets/prologue.png"
      : chapter.image;

    const number = intro ? "00" : pad(chapter.id);

    const date = intro
      ? "01 / 47 · HOKKAIDO"
      : formatDate(chapter.release);

    $("page").innerHTML = `
      <article class="diary-spread">

        <section class="image-side">

          <div class="chapter-label">
            ${escapeText(label)}
          </div>

          <figure class="photo">

            <div class="photo-placeholder">
              ${escapeText(place)}
            </div>

            <img
              src="${escapeText(image)}"
              alt="${escapeText(place)}"
              loading="eager">

            <figcaption>
              ${escapeText(place)}
            </figcaption>

          </figure>

        </section>

        <section class="text-side">

          <div class="page-meta">
            <span>${escapeText(label)}</span>
            <span>${escapeText(date)}</span>
          </div>

          <h2 class="diary-title">
            ${escapeText(title)}
          </h2>

          <div class="title-rule"></div>

          <div class="diary-text">
            ${paragraphs(text)}
          </div>

          <div class="page-footer">
            <span>TRAVELING TAKOYAKI</span>
            <span>${number}</span>
          </div>

        </section>

      </article>
    `;
  }

  function render() {

    document.documentElement.lang = language;

    $("languageBtn").textContent =
      language === "ja" ? "ENGLISH" : "日本語";

    $("indexBtn").textContent =
      language === "ja" ? "目次" : "INDEX";

    $("prevBtn").textContent =
      language === "ja" ? "← 前へ" : "← PREVIOUS";

    $("nextBtn").textContent =
      language === "ja" ? "次へ →" : "NEXT →";

    $("prevBtn").disabled = currentPage === 0;
    $("nextBtn").disabled = currentPage >= maxPage();

    const pageElement = $("page");

    pageElement.classList.remove("flipping");

    void pageElement.offsetWidth;

    pageElement.classList.add("flipping");

    if (currentPage === 0) {
      renderCover();
    } else {
      renderStory();
    }

    setupImages();

    if (currentPage === 0) {
      $("pageIndicator").textContent =
        language === "ja" ? "表紙" : "COVER";
    } else if (currentPage === 1) {
      $("pageIndicator").textContent =
        language === "ja" ? "プロローグ" : "PROLOGUE";
    } else {
      $("pageIndicator").textContent =
        "CHAPTER " + pad(currentPage - 1) + " / 12";
    }

    const count = openCount();

    if (count < chapters.length) {
      $("nextRelease").textContent =
        (language === "ja" ? "次の公開：" : "NEXT: ") +
        formatDate(chapters[count].release);
    } else {
      $("nextRelease").textContent =
        language === "ja"
          ? "北海道編 完結"
          : "HOKKAIDO COMPLETE";
    }

    showReactions();

    // プレビュー用URLの状態を反映
    try {
      const hash =
        currentPage === 0 ? "" : "#page-" + currentPage;

      history.replaceState(
        null,
        "",
        location.pathname + location.search + hash
      );
    } catch (_) {
      // ローカルファイルでURL操作が制限されても、
      // 日記の表示は止めない
    }
  }

  function goTo(target) {

    if (target < 0 || target > maxPage()) {
      return;
    }

    currentPage = target;

    render();

    $("notebook").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function openIndex() {

    const list = $("chapterList");

    const items = [
      {
        page: 1,
        title: language === "ja"
          ? "鉄板の向こう側"
          : "Beyond the Griddle",
        label: "PROLOGUE 00",
        open: true,
        release: null
      },
      ...chapters.map(ch => ({
        page: ch.id + 1,
        title: titleFor(ch),
        label: "CHAPTER " + pad(ch.id),
        open: isOpen(ch),
        release: ch.release
      }))
    ];

    list.innerHTML = items.map(item => `
      <button
        type="button"
        class="chapter-item ${item.open ? "" : "locked"}"
        data-page="${item.page}"
        ${item.open ? "" : "disabled"}>

        <small>
          ${item.open ? "📖" : "🔒"}
          ${escapeText(item.label)}
        </small>

        <strong>
          ${escapeText(item.title)}
        </strong>

        ${item.release
          ? `<small>${escapeText(formatDate(item.release))}</small>`
          : ""}

      </button>
    `).join("");

    list.querySelectorAll("[data-page]").forEach(button => {
      button.addEventListener("click", () => {
        closeIndex();
        goTo(Number(button.dataset.page));
      });
    });

    $("indexTitle").textContent =
      language === "ja" ? "旅の目次" : "INDEX";

    $("indexModal").classList.add("open");
    $("closeIndex").focus();
  }

  function closeIndex() {
    $("indexModal").classList.remove("open");
  }

  /* ========================================
     REACTIONS
  ======================================== */

  async function showReactions() {

    const token = ++reactionSequence;
    const area = $("reactionArea");

    if (currentPage < 2) {
      area.hidden = true;
      area.innerHTML = "";
      return;
    }

    const chapter = chapters[currentPage - 2];

    if (!chapter || !isOpen(chapter)) {
      area.hidden = true;
      return;
    }

    area.hidden = false;

    const types = [
      ["heart", "❤️"],
      ["laugh", "😂"],
      ["cry", "😢"]
    ];

    area.innerHTML = `
      <h3 class="reaction-heading">
        ${language === "ja"
          ? "このお話、どうだった？"
          : "HOW DID YOU FEEL?"}
      </h3>

      <div class="reaction-buttons">

        ${types.map(([type, emoji]) => `
          <button
            type="button"
            class="reaction-button"
            data-reaction="${type}"
            aria-pressed="false"
            disabled>

            <span class="emoji">${emoji}</span>
            <span class="count">—</span>

          </button>
        `).join("")}

      </div>

      <p class="reaction-message" id="reactionMessage">
        ${language === "ja"
          ? "リアクションを読み込み中…"
          : "Loading reactions..."}
      </p>
    `;

    const backend = window.reactionsBackend;

    if (!backend) {
      $("reactionMessage").textContent =
        language === "ja"
          ? "Firebase設定後に投票と集計が利用できます。"
          : "Reactions will be enabled after Firebase setup.";
      return;
    }

    try {
      const result = await backend.read(chapter.key);

      if (token !== reactionSequence) return;

      types.forEach(([type]) => {

        const button = area.querySelector(
          `[data-reaction="${type}"]`
        );

        if (!button) return;

        button.disabled = false;

        button.querySelector(".count").textContent =
          result.counts[type] ?? 0;

        const selected = result.selected === type;

        button.classList.toggle("selected", selected);

        button.setAttribute(
          "aria-pressed",
          selected ? "true" : "false"
        );

        button.addEventListener("click", async () => {

          area.querySelectorAll(
            ".reaction-button"
          ).forEach(b => {
            b.disabled = true;
          });

          try {
            await backend.vote(
              chapter.key,
              type,
              result.selected
            );

            if (token === reactionSequence) {
              showReactions();
            }

          } catch (error) {
            console.error(error);

            if (token === reactionSequence) {
              $("reactionMessage").textContent =
                language === "ja"
                  ? "投票できませんでした。もう一度お試しください。"
                  : "Voting failed. Please try again.";

              area.querySelectorAll(
                ".reaction-button"
              ).forEach(b => {
                b.disabled = false;
              });
            }
          }

        });

      });

      $("reactionMessage").textContent =
        language === "ja"
          ? "1話につき1種類。もう一度押すと取り消せます。"
          : "Choose one reaction. Tap again to remove it.";

    } catch (error) {
      console.error(error);

      if (token !== reactionSequence) return;

      $("reactionMessage").textContent =
        language === "ja"
          ? "リアクションを読み込めませんでした。"
          : "Unable to load reactions.";
    }
  }

  window.refreshDiaryReactions = showReactions;

  /* ========================================
     EVENTS
  ======================================== */

  $("prevBtn").addEventListener("click", () => {
    goTo(currentPage - 1);
  });

  $("nextBtn").addEventListener("click", () => {
    goTo(currentPage + 1);
  });

  $("indexBtn").addEventListener("click", openIndex);

  $("closeIndex").addEventListener("click", closeIndex);

  $("indexModal").addEventListener("click", event => {
    if (event.target === $("indexModal")) {
      closeIndex();
    }
  });

  $("languageBtn").addEventListener("click", () => {

    language = language === "ja" ? "en" : "ja";

    try {
      localStorage.setItem(
        "travel-diary-language",
        language
      );
    } catch (_) {}

    render();
  });

  document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
      closeIndex();
      return;
    }

    if ($("indexModal").classList.contains("open")) {
      return;
    }

    if (event.key === "ArrowRight") {
      goTo(currentPage + 1);
    }

    if (event.key === "ArrowLeft") {
      goTo(currentPage - 1);
    }
  });

  let touchX = null;

  $("page").addEventListener(
    "touchstart",
    event => {
      touchX = event.touches[0].clientX;
    },
    { passive: true }
  );

  $("page").addEventListener(
    "touchend",
    event => {
      if (touchX === null) return;

      const distance =
        event.changedTouches[0].clientX - touchX;

      touchX = null;

      if (Math.abs(distance) > 85) {
        goTo(currentPage + (distance < 0 ? 1 : -1));
      }
    },
    { passive: true }
  );

  const match =
    location.hash.match(/^#page-(\d+)$/);

  currentPage = Math.min(
    match ? Number(match[1]) : 0,
    maxPage()
  );

  // 実際に表示が失敗しないように、
  // 初期画面を即時に描画
  render();

  let lastOpenCount = openCount();

  setInterval(() => {

    const count = openCount();

    if (count !== lastOpenCount) {
      lastOpenCount = count;
      render();
    }

  }, 60000);

})();
</script>

<script type="module">
/* ============================================
   FIREBASE REACTIONS

   Firebaseを設定するまでは
   日記本体だけが動きます。

   コメント機能はありません。
============================================ */

/*
   Firebase Console で
   プロジェクトとWebアプリを作成し、
   下の設定に実際の値を入れてください。
*/

const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};

/*
   以下は設定後に利用する投票システム。
   Authenticationの匿名認証と
   Firestoreの設定が必要です。
*/

if (
  firebaseConfig.apiKey &&
  firebaseConfig.projectId &&
  firebaseConfig.appId
) {

  try {

    const VERSION = "11.10.0";

    const [
      appModule,
      authModule,
      firestoreModule
    ] = await Promise.all([

      import(
        `https://www.gstatic.com/firebasejs/${VERSION}/firebase-app.js`
      ),

      import(
        `https://www.gstatic.com/firebasejs/${VERSION}/firebase-auth.js`
      ),

      import(
        `https://www.gstatic.com/firebasejs/${VERSION}/firebase-firestore.js`
      )

    ]);

    const app = appModule.initializeApp(firebaseConfig);

    const auth = authModule.getAuth(app);

    const db = firestoreModule.getFirestore(app);

    await auth.authStateReady();

    const user = auth.currentUser ||
      (await authModule.signInAnonymously(auth)).user;

    const {
      doc,
      collection,
      query,
      where,
      getDoc,
      getCountFromServer,
      setDoc,
      deleteDoc,
      serverTimestamp
    } = firestoreModule;

    function voteRef(chapterKey) {
      return doc(
        db,
        "diaryChapters",
        chapterKey,
        "votes",
        user.uid
      );
    }

    function voteCollection(chapterKey) {
      return collection(
        db,
        "diaryChapters",
        chapterKey,
        "votes"
      );
    }

    window.reactionsBackend = {

      async read(chapterKey) {

        const ownVote = await getDoc(
          voteRef(chapterKey)
        );

        const selected = ownVote.exists()
          ? ownVote.data().type
          : null;

        const types = [
          "heart",
          "laugh",
          "cry"
        ];

        const results = await Promise.all(
          types.map(type =>
            getCountFromServer(
              query(
                voteCollection(chapterKey),
                where("type", "==", type)
              )
            )
          )
        );

        const counts = {};

        types.forEach((type, index) => {
          counts[type] = results[index].data().count;
        });

        return {
          selected,
          counts
        };
      },

      async vote(chapterKey, type, selected) {

        if (!["heart", "laugh", "cry"].includes(type)) {
          throw new Error("Invalid reaction");
        }

        const ref = voteRef(chapterKey);

        if (selected === type) {

          await deleteDoc(ref);

        } else {

          await setDoc(ref, {
            type,
            updatedAt: serverTimestamp()
          });

        }
      }

    };

    // Firebaseの接続後に、
    // 表示中の話の投票数を読み直す
    if (window.refreshDiaryReactions) {
      window.refreshDiaryReactions();
    }

  } catch (error) {
    console.error("Firebase initialization error:", error);
  }

}
</script>
