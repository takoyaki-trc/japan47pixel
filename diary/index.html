<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11283b">
<meta name="description" content="TRAVELING TAKOYAKI — One takoyaki, 47 prefectures, an impossible road trip.">
<title>TRAVEL DIARY | TRAVELING TAKOYAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#11283b;--ink:#38291d;--paper:#fffaf0;--red:#b74432;--rule:#ddd0bb;--jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;--en:'Fredoka','Zen Maru Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#2d526b,#102638 58%,#071622 100%);color:var(--ink);font-family:var(--jp)}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible{outline:3px solid #ffce6a;outline-offset:3px}
[hidden]{display:none!important}
.header{width:min(1050px,100%);margin:auto;padding:13px 13px;display:flex;align-items:center;justify-content:space-between;gap:7px;color:white}
.brand{font:700 clamp(13px,2.9vw,19px)/1.15 var(--en);white-space:nowrap;letter-spacing:.015em}
.head-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.head-btn{height:40px;min-width:42px;padding:0 11px;border:2px solid #0b1116;background:#fff9ed;color:#1d1a18;box-shadow:3px 3px 0 #07131c;border-radius:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;white-space:nowrap}
.head-btn:hover{background:#f1dfb9}
#langBtn{min-width:78px}
.home-btn{font-size:22px}
/* The title illustration stretches edge-to-edge and has no border */
.hero{width:100%;background:#285470;overflow:hidden}
.hero img{display:block;width:100%;height:auto;image-rendering:pixelated}
.hero-fallback{display:none;min-height:145px;align-items:center;justify-content:center;text-align:center;padding:22px;color:white;font:700 clamp(23px,5vw,45px)/1.2 var(--en)}
.container{width:min(1050px,100%);margin:auto;padding:0 10px}
.notebook{position:relative;margin:22px 0 15px;padding:13px 13px 13px 43px;border:7px solid #895a37;border-radius:17px;background:linear-gradient(130deg,#e9c790,#c8955d);box-shadow:0 14px 33px #0006,inset 0 0 0 4px #f2d6a5}
/* Square separated holes, not round rings */
.notebook::before{content:'';position:absolute;top:18px;bottom:18px;left:14px;width:18px;background:repeating-linear-gradient(to bottom,#5c422b 0 14px,#f4d39c 14px 37px);box-shadow:inset 2px 2px 2px #25170c77,1px 0 #f7ddac}
.page{background:var(--paper);border-radius:2px;min-height:520px;overflow:hidden}
.page.turn{animation:turn .27s ease-out}
@keyframes turn{from{opacity:.65;transform:perspective(1200px) rotateY(-5deg)}to{opacity:1;transform:rotateY(0)}}
/* Paper cover */
.cover{position:relative;min-height:590px;padding:46px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background-color:#d3ac7b;background-image:radial-gradient(#815c3526 1px,transparent 1px),repeating-linear-gradient(12deg,transparent 0 13px,#7347210b 14px 15px,transparent 16px 30px),linear-gradient(145deg,#e8cba1,#d2ad7f 55%,#c29965);background-size:16px 19px,auto,auto}
.cover::before{content:'';pointer-events:none;position:absolute;inset:16px;border:3px double #795638}
.cover>*{position:relative;max-width:640px}
.cover-kicker{font-size:12px;font-weight:900;letter-spacing:.14em}
.cover-rule{margin:17px 0;color:#8b6240;font-weight:900}
.stamp{border:3px solid #ab4534;color:#ab4534;padding:7px 15px;font-weight:900;letter-spacing:.08em;transform:rotate(-5deg);margin:6px 0 25px;font-size:clamp(15px,3vw,22px)}
.cover h1{margin:0;font-family:var(--jp);font-size:clamp(38px,7.8vw,75px);font-weight:900;line-height:1.12;letter-spacing:-.045em;color:#372719}
.cover h1.en{font-family:var(--en);font-weight:700;letter-spacing:-.02em}
.cover h1 span{display:block}
.cover-subtitle{color:#9e4234;font-weight:900;font-size:clamp(18px,3.5vw,28px);margin-top:20px;border-top:1px solid #866343;padding-top:14px;width:86%}
.cover-description{max-width:480px;margin:23px 0 0;line-height:1.72;font-size:15px;font-weight:700}
.open-btn{margin-top:26px;background:#c44834;border:3px solid #3e241a;color:white;box-shadow:4px 4px 0 #593b29;font-weight:900;font-size:18px;padding:12px 24px}
.cover-foot{margin-top:29px;font-size:12px;font-weight:700;color:#765538}
/* Story spreads: mobile single column, desktop double page */
.spread{display:grid;grid-template-columns:1fr 1fr;min-height:570px}
.art-side{min-width:0;background:#ecdec4;padding:23px;display:flex;flex-direction:column;gap:14px;border-right:1px solid #bca582}
.kicker{font:700 12px var(--en);color:#856a50;letter-spacing:.09em}
.photo{width:min(100%,430px);padding:11px 11px 21px;background:#fffbf1;box-shadow:2px 8px 16px #4a34294b;transform:rotate(-1deg);position:relative;margin:auto}
.photo::before{content:'';position:absolute;top:-11px;left:calc(50% - 39px);width:78px;height:21px;background:#cdb085b0;transform:rotate(3deg)}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated}
.photo .photo-fallback{display:none;aspect-ratio:1;align-items:center;justify-content:center;background:linear-gradient(#99d2e0 0 55%,#82aa7d 55%);font-size:17px;font-weight:900;text-align:center;padding:16px}
.photo figcaption{padding-top:14px;text-align:center;color:#735a40;font-size:12px;font-weight:900}
.text-side{min-width:0;background:#fffaf0;padding:29px 31px 20px 35px;display:flex;flex-direction:column}
.meta{display:flex;justify-content:space-between;gap:8px;font:700 11px var(--en);color:#80644b}
.story-title{font-size:clamp(25px,3.6vw,35px);font-weight:900;line-height:1.32;margin:22px 0 12px;letter-spacing:-.02em;overflow-wrap:anywhere}
.underline{height:5px;width:65px;background:var(--red);margin-bottom:19px}
/* Every paragraph draws its OWN rules so wrapping never drifts */
.story{--leading:29px;font-size:16px;font-weight:500;line-height:var(--leading);letter-spacing:0;overflow-wrap:anywhere}
.story p{margin:0 0 4px;line-height:var(--leading);background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--leading) - 1px),var(--rule) calc(var(--leading) - 1px) var(--leading));background-size:100% var(--leading)}
.story p:last-child{font-weight:900;color:#a44334}
.page-foot{margin-top:auto;padding-top:17px;border-top:1px solid #c8b495;display:flex;justify-content:space-between;gap:12px;color:#806c51;font:700 10px var(--en)}
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:20px 0 24px}
.navbtn{border:2px solid #c2a67d;background:#f6e5c9;border-radius:5px;padding:11px 14px;min-height:48px;font-weight:900;font-size:12px;color:#32251b;box-shadow:3px 3px 0 #071521;white-space:nowrap}
.navbtn:last-child{justify-self:end}
.status{text-align:center;color:#f6e5c7;font-weight:700;font-size:11px;line-height:1.55}
.status small{display:block;color:#d1b995;font-size:10px;font-weight:500}
.footer{text-align:center;font:700 11px var(--en);letter-spacing:.09em;color:#dac6a7;padding:0 0 26px}
/* Table of contents */
.overlay{position:fixed;inset:0;z-index:99;background:#07121de8;padding:12px;display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.toc{width:min(700px,100%);max-height:90dvh;overflow-y:auto;background:#f8ecd5;border:6px solid #845b38;border-radius:8px;padding:17px}
.toc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c4a580;padding-bottom:11px}
.toc-head h2{font-size:20px;margin:0}
.close{border:0;background:#bb4736;color:white;padding:8px 14px;font-weight:900}
.toc-items{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.toc-entry{background:#fffaf0;border:1px solid #d4b995;padding:12px;text-align:left;color:#352a21;min-height:73px}
.toc-entry strong{display:block;font-size:13px;line-height:1.4}.toc-entry small{display:block;font-size:10px;color:#846f56;margin:3px 0}
.toc-entry:disabled{background:#e6d9c6;opacity:.7}
@media(max-width:720px){
  .header{padding:10px 9px}.brand{font-size:14px}.head-btn{height:36px;min-width:34px;padding:0 9px;font-size:11px}#langBtn{min-width:72px}
  .container{padding:0 8px}.notebook{padding:11px 10px 11px 30px;border-width:6px;margin-top:15px}.notebook::before{left:9px;top:13px;bottom:13px;width:13px;background:repeating-linear-gradient(to bottom,#5c422b 0 12px,#f4d39c 12px 33px)}
  .page{min-height:0}.cover{min-height:510px;padding:46px 18px}.cover::before{inset:11px}.cover h1{font-size:clamp(34px,8vw,58px)}
  .spread{display:block;min-height:0}.art-side{padding:17px;border:0}.photo{width:min(91%,410px)}.text-side{padding:23px 19px 19px}.story-title{font-size:26px}
  .story{--leading:29px;font-size:16px;line-height:var(--leading)}.story p{margin-bottom:3px}
  .navbtn{padding:10px 7px;font-size:11px}.toc-items{grid-template-columns:1fr}
}
@media(max-width:370px){.brand{font-size:12px}.head-btn{padding:0 6px}#langBtn{min-width:63px}.story{font-size:15px;--leading:27px}.status{font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.page.turn{animation:none}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">TRAVEL DIARY</div>
  <nav class="head-actions" aria-label="Diary navigation">
    <button class="head-btn" id="tocBtn" type="button">INDEX</button>
    <button class="head-btn" id="langBtn" type="button">日本語</button>
    <a class="head-btn home-btn" href="https://japan47pixel.net/" aria-label="Official site">⌂</a>
  </nav>
</header>
