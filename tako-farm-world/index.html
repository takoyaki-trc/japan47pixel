function open(p){panel=p;$('shade').hidden=false;$('sheet').hidden=false;render()}function close(){panel='';$('shade').hidden=true;$('sheet').hidden=true}$('shade').onclick=close;const btn=(t,a,d=false)=>`<button class="primary" data-a="${a}" ${d?'disabled':''}>${t}</button>`,row=(n,d,b,k='')=>`<div class="item">${k?icon(k):''}<div class="desc">${n}<small>${d}</small></div>${b}</div>`;function price(i){return Math.round(crops[i][2]*(.8+((Math.floor(now()/86400000)*17+i*31)%41)/100))}function val(i){return s.stock[i].reduce((a,v,j)=>a+v*price(i)*mult[j],0)}
function render(){let t='',h='';if(panel==='shop'){t='種ショップ';h=crops.map((a,i)=>row(a[0],`${a[1]} G / ${a[3]}秒 / Lv.${a[4]} ｜ 所持 ${s.seeds[i]}`,btn('選択','pick:'+i,level()<a[4])+btn('＋5','buy:'+i,level()<a[4]||s.coins<a[1]*5),a[6])).join('')}
else if(panel==='stock'){t='倉庫・出荷';h=crops.map((a,i)=>row(a[0],s.stock[i].map((v,j)=>ranks[j]+':'+v).join('　'),btn(fmt(val(i))+' G','sell:'+i,!val(i)),a[6])).join('')+'<div class="actions">'+btn('すべて出荷','sellall',!crops.some((_,i)=>val(i)))+'</div>'+fac.map((a,i)=>row(a[1],s.goods[i]+'個',btn('売却 '+fmt(s.goods[i]*a[6])+'G','goods:'+i,!s.goods[i]),a[7])).join('')}
else if(panel==='book'){t='作物図鑑 '+s.book.flat().filter(Boolean).length+'/'+(crops.length*5);h=crops.map((a,i)=>row(a[0],s.book[i].reduce((a,b)=>a+b,0)+'個収穫',ranks.map((r,j)=>`<span class="rank ${s.book[i][j]?'':'off'}">${r}</span>`).join(' '),a[6])).join('')}
else if(panel==='buyland'){t='畑を購入';h=`<p>${landNames[terrain(selected)]}の畑・現在 ${count()} / ${plotEls.length} 区画</p>`+btn(fmt(cost(selected))+' Gで購入','land',s.coins<cost(selected)||own(selected))}
else if(panel==='land'){t='農園の土地';h=`<p>所有区画 ${count()} / ${plotEls.length}。農園の「＋」が付いた土地をタップして購入してください。</p>`+btn('畑へ移動','fieldmap')}
else if(panel==='market'){t='本日の市場';h=crops.map((a,i)=>row(a[0],'基本価格 '+a[2]+' G',fmt(price(i))+' G',a[6])).join('')}
else if(panel==='orders'){t='注文ボード';let i=s.orders%crops.filter(a=>level()>=a[4]).length,n=3+s.orders%4;h=row(crops[i][0]+'（N）×'+n,'報酬 '+fmt(price(i)*n*2)+' G',btn('納品','order',s.stock[i][0]<n),crops[i][6])}
else if(panel==='fac'||panel==='facility'){t=panel==='fac'?'牧場・加工施設':fac[facility][0];h=(panel==='fac'?[0,1,2,3]:[facility]).map(i=>{let a=fac[i],p=s.fac[i];return row(a[0],!p?`Lv.${a[3]} / ${fmt(a[2])} G`:p.end?seconds(p.end)?'生産中 '+seconds(p.end)+'秒':'回収可能':i===3?'小麦粉×1・卵×1':'小麦（N）×'+a[5],!p?btn('建設','facbuy:'+i,level()<a[3]||s.coins<a[2]):p.end?btn('回収','facget:'+i,seconds(p.end)>0):btn('生産開始','facstart:'+i,i===3?!(s.goods[0]&&s.goods[2]):s.stock[0][0]<a[5]),a[7])}).join('')}
else if(panel==='profile'){t='わたしの農園';h=`<p>レベル ${level()}<br>畑 ${count()} 区画<br>収穫 ${s.harvests} 個<br>納品 ${s.orders} 回</p>`}
else if(panel==='more'){t='その他';h='<div class="more">'+[['釣り','fishing'],['ペット','pets'],['道具','tools'],['デイリー','daily'],['探索','explore'],['設定','settings']].map(([a,b])=>btn(a,'nav:'+b)).join('')+'</div>'}
else if(panel==='pets'){t='ペット広場';h=s.pet<0?row('柴犬','350 G',btn('迎える','pet',s.coins<350),'dog'):row('柴犬',s.petEnd?seconds(s.petEnd)?'宝探し '+seconds(s.petEnd)+'秒':'宝箱発見！':'待機中',s.petEnd?btn('報酬','petget',seconds(s.petEnd)>0):btn('宝探し','petgo'),'dog')}
else if(panel==='fishing'){t='釣り場';h=row('釣り竿','餌：小麦（N）1個',s.fishEnd?btn('釣り上げる','fishget',seconds(s.fishEnd)>0):btn('釣りをする','fish',s.stock[0][0]<1),'dock')+row('魚','所持 '+s.fish+' 匹',btn('売却 '+s.fish*40+' G','fishsell',!s.fish))}
else if(panel==='tools'){t='道具小屋';h=row('農具 Lv.'+(s.tool+1),'成長時間 '+s.tool*8+'% 短縮',btn('強化 '+250*(s.tool+1)+'G','tool',s.tool>=5||s.coins<250*(s.tool+1)))}
else if(panel==='daily'){t='デイリーボーナス';h=btn('150 G ＋ 小麦の種5個','daily',s.day===new Date().toDateString())}
else if(panel==='explore'){t='探索';h=row('こもれびの森',s.trip?seconds(s.trip)?seconds(s.trip)+'秒':'回収可能':'100 G / 25秒',s.trip?btn('回収','tripget',seconds(s.trip)>0):btn('派遣','trip',s.coins<100),'tree')}
else if(panel==='settings'){t='設定';h='<p>このグラフィックテストは独立したセーブデータを使用します。旧版のセーブデータはそのまま残っています。<br><a style="color:#ffdc91" href="classic-08.html">Ver.0.8（旧版）を開く</a></p>'+btn('最初から','reset')}
$('sheet').innerHTML='<button class="close" data-a="close">閉じる</button><h2>'+t+'</h2>'+h}
$('sheet').onclick=e=>{let b=e.target.closest('[data-a]');if(!b||b.disabled)return;let [a,k]=b.dataset.a.split(':'),i=+k,msg='';if(a==='close')return close();if(a==='nav')return open(k);if(a==='fieldmap'){close();$('fields').click();return}if(a==='pick'&&level()>=crops[i][4]){s.seed=i;close();msg='種を選択'}else if(a==='buy'&&level()>=crops[i][4]&&s.coins>=crops[i][1]*5){s.coins-=crops[i][1]*5;s.seeds[i]+=5;s.seed=i;msg='種を5個購入'}else if(a==='sell'||a==='sellall'){let g=0;(a==='sell'?[i]:crops.map((_,i)=>i)).forEach(j=>{g+=val(j);s.stock[j].fill(0)});s.coins+=g;msg=fmt(g)+' Gを獲得'}else if(a==='goods'){s.coins+=s.goods[i]*fac[i][6];s.goods[i]=0;msg='出荷完了'}else if(a==='land'&&!own(selected)&&s.coins>=cost(selected)){s.coins-=cost(selected);s.plots[selected]=null;close();msg='畑を購入しました'}else if(a==='order'){let j=s.orders%crops.filter(a=>level()>=a[4]).length,n=3+s.orders%4;if(s.stock[j][0]>=n){s.stock[j][0]-=n;s.coins+=price(j)*n*2;s.xp+=10;s.orders++;msg='納品完了！'}}else if(a==='facbuy'&&!s.fac[i]&&s.coins>=fac[i][2]&&level()>=fac[i][3]){s.coins-=fac[i][2];s.fac[i]={end:0};msg='建設しました'}else if(a==='facstart'&&s.fac[i]&&!s.fac[i].end){if(i===3){if(!s.goods[0]||!s.goods[2])return;s.goods[0]--;s.goods[2]--}else{if(s.stock[0][0]<fac[i][5])return;s.stock[0][0]-=fac[i][5]}s.fac[i].end=now()+fac[i][4]*1000;msg='生産開始'}else if(a==='facget'&&s.fac[i]?.end&&s.fac[i].end<=now()){s.fac[i].end=0;s.goods[i]++;s.xp+=12;msg='回収しました'}else if(a==='pet'&&s.pet<0&&s.coins>=350){s.coins-=350;s.pet=0;msg='ペットが仲間になりました'}else if(a==='petgo'&&s.pet>=0&&!s.petEnd){s.petEnd=now()+20000;msg='宝探しへ出発'}else if(a==='petget'&&s.petEnd&&s.petEnd<=now()){s.petEnd=0;s.coins+=75;msg='75 G 獲得'}else if(a==='fish'&&!s.fishEnd&&s.stock[0][0]){s.stock[0][0]--;s.fishEnd=now()+12000;msg='釣りを開始'}else if(a==='fishget'&&s.fishEnd&&s.fishEnd<=now()){s.fishEnd=0;s.fish++;msg='魚が釣れました'}else if(a==='fishsell'){s.coins+=40*s.fish;s.fish=0;msg='魚を出荷'}else if(a==='tool'&&s.tool<5&&s.coins>=250*(s.tool+1)){s.coins-=250*(s.tool+1);s.tool++;msg='農具を強化'}else if(a==='daily'&&s.day!==new Date().toDateString()){s.day=new Date().toDateString();s.coins+=150;s.seeds[0]+=5;msg='ボーナス獲得'}else if(a==='trip'&&!s.trip&&s.coins>=100){s.coins-=100;s.trip=now()+25000;msg='探索に出発'}else if(a==='tripget'&&s.trip&&s.trip<=now()){s.trip=0;s.coins+=160;s.seeds[0]+=3;msg='探索報酬獲得'}else if(a==='reset'&&confirm('テストデータをリセットしますか？')){s=fresh();close();msg='新しい農園'}if(msg)update(msg)};
