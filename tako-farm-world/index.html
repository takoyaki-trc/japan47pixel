$('sheet').onclick=e=>{let b=e.target.closest('[data-a]');if(!b||b.disabled)return;let [a,k]=b.dataset.a.split(':'),i=+k;if(a==='close')close();else if(a.startsWith('fm')){farmAction(a.slice(2),i)}else if(a.startsWith('ex')){extraAction(a.slice(2),i)}else if(a.startsWith('fac')||a==='goodsell'||a==='ranchjump'){facilityAction(a,i)}else if(a==='pick'&&lv()>=crops[i][4]){s.seed=i;close();change(crops[i][0]+' を選択')}else if(a==='buy'||a==='buy5'){let n=a==='buy5'?5:1;if(lv()>=crops[i][4]&&s.coins>=crops[i][1]*n){s.coins-=crops[i][1]*n;s.seeds[i]+=n;s.seed=i;change('種を'+n+'個購入')}}else if(a==='sell'||a==='sellall'){let g=0;(a==='sell'?[i]:crops.map((_,i)=>i)).forEach(j=>{g+=val(j);s.stock[j].fill(0)});s.coins+=g;ex().sold+=g;change(fmt(g)+' Gを獲得')}else if(a==='land'&&!own(selected)&&s.coins>=landCost(selected)){s.coins-=landCost(selected);s.plots[selected]=null;close();change('畑を購入しました')}else if(a==='order'){let j=s.orders%crops.filter(a=>lv()>=a[4]).length,n=3+s.orders%4;if(s.stock[j][0]>=n){s.stock[j][0]-=n;s.coins+=price(j)*n*2;s.orders++;ex().delivered++;s.xp+=10;change('納品完了！')}}else if(a==='save'){save();close();note('保存しました')}else if(a==='reset'&&confirm('農園を最初からやり直しますか？')){s=fresh();close();change('新しい農園を開始')}};

function facilityPanel(indices){return '<p>施設はコインで購入します。材料を入れると時間経過で生産されます。</p>'+indices.map(i=>{let a=facDefs[i],p=s.fac[i],left=p&&p.end?Math.max(0,Math.ceil((p.end-Date.now())/1000)):0,mat=i===3?'小麦粉×1・卵×1':'小麦（N）×'+a.wheat,can=i===3?s.goods[2]>0&&s.goods[0]>0:s.stock[0][0]>=a.wheat;return row(a.name,!p?'Lv.'+a.lv+' / '+fmt(a.cost)+' G':p.end?(left?'生産中：約'+left+'秒':'回収可能'):'材料：'+mat,!p?btn('購入','facbuy:'+i,lv()<a.lv||s.coins<a.cost):p.end?btn('回収','facget:'+i,left>0):btn(i<2?'餌やり':'製造開始','facstart:'+i,!can))}).join('')+'<div class="action">'+btn('牧場マップへ','ranchjump')+'</div>'}
function goodsPanel(){return '<h2 style="margin-top:15px">畜産・加工品</h2>'+facDefs.map((a,i)=>row(a.good,'所持 '+s.goods[i]+' 個',btn(fmt(s.goods[i]*a.sale)+' Gで売る','goodsell:'+i,!s.goods[i]))).join('')}
function facilityAction(a,i){if(a==='ranchjump'){close();goRanch();return}let d=facDefs[i];if(!d)return;let p=s.fac[i];if(a==='facbuy'&&!p&&lv()>=d.lv&&s.coins>=d.cost){s.coins-=d.cost;s.fac[i]={end:0};change(d.name+' を建設！')}else if(a==='facstart'&&p&&!p.end){if(i===3){if(s.goods[2]<1||s.goods[0]<1)return;s.goods[2]--;s.goods[0]--}else{if(s.stock[0][0]<d.wheat)return;s.stock[0][0]-=d.wheat}p.end=Date.now()+d.secs*1000;change('生産を開始しました')}else if(a==='facget'&&p&&p.end&&p.end<=Date.now()){p.end=0;s.goods[i]++;s.goodsBook[i]++;s.xp+=12+i*4;change(d.good+' を回収！')}else if(a==='goodsell'&&s.goods[i]>0){let g=s.goods[i]*d.sale;s.goods[i]=0;s.coins+=g;change(fmt(g)+' Gを獲得！')}}

const dateKey=()=>new Date().toLocaleDateString('sv-SE');
function ex(){if(!s.extra||typeof s.extra!=='object')s.extra={day:'',planted:0,harvested:0,delivered:0,sold:0,claimed:[],daily:'',tool:0,fert:0,pet:-1,petEnd:0,helperEnd:0,helperTick:0,rod:0,bait:0,fishEnd:0,fish:[0,0,0,0,0],fishBook:[0,0,0,0,0],decor:[false,false,false],dragons:[]};let e=s.extra;if(e.day!==dateKey()){e.day=dateKey();e.planted=0;e.harvested=0;e.delivered=0;e.sold=0;e.claimed=[]}return e}
const petDefs=[['茶白のネコ',350,35],['柴犬',850,55],['白うさぎ',1600,85]],fishDefs=[['メダカ',12],['フナ',28],['ニジマス',65],['黄金コイ',250],['幻の深海魚',1200]],decDefs=[['花壇',100],['木製ベンチ',180],['石の噴水',600]],dragDefs=['炎','水','森','雷','月'];
function golden(t=Date.now()){return Math.floor(t/60000)%10===0}
function sec(end){return Math.max(0,Math.ceil((end-Date.now())/1000))}
function timeText(end){let n=sec(end);return n?n+'秒':'回収可能'}
function tasks(){let e=ex();return [['種まき10回',e.planted,10,120],['作物を10個収穫',e.harvested,10,200],['注文を1回納品',e.delivered,1,250],['出荷で500G獲得',e.sold,500,300]]}
function extraPanel(p){let e=ex(),t='',h='';
if(p==='pets'){t='ペット・宝探し';h='<p>ペットをコインで迎え、農園の宝探しへ送り出せます。</p>'+petDefs.map((a,i)=>row(a[0],e.pet===i?'同行中':fmt(a[1])+' G',e.pet===i?'':btn('迎える','expet:'+i,e.pet>=0||s.coins<a[1]))).join('');if(e.pet>=0)h+='<div class="action">'+(e.petEnd?btn('宝箱を開ける '+timeText(e.petEnd),'expetget',sec(e.petEnd)>0):btn('宝探しへ出発（無料）','expetgo'))+'</div>'}
else if(p==='quests'){t='デイリークエスト';h=tasks().map((a,i)=>row(a[0],Math.min(a[1],a[2])+' / '+a[2]+' ・ '+a[3]+' G',btn(e.claimed.includes(i)?'受取済':'報酬','exquest:'+i,e.claimed.includes(i)||a[1]<a[2]))).join('')}
else if(p==='daily'){t='デイリーボーナス';h='<p>1日1回、コインと小麦の種を受け取れます。<br>ゴールデンアワー中は作物の収穫量が2倍になります。</p>'+btn(e.daily===e.day?'受取済':'150 G ＋ 種5個','exdaily',e.daily===e.day)}
else if(p==='helper'){t='農園の助っ人';h='<p>農園スタッフを雇うと、空き畑への種まきと収穫を自動で行います。種は持ち物から消費します。テスト中は60秒間有効です。</p>'+row('農園スタッフ',e.helperEnd>Date.now()?'稼働中：'+sec(e.helperEnd)+'秒':'60秒 / 150 G',btn('雇う','exhire',e.helperEnd>Date.now()||s.coins<150))}
else if(p==='tools'){t='道具小屋';h=row('農具 Lv.'+(e.tool+1),'成長時間 '+(e.tool*8)+'%短縮（最大40%）',btn(e.tool>=5?'最大':'強化 '+(250*(e.tool+1))+' G','extool',e.tool>=5||s.coins<250*(e.tool+1)))+row('肥料','次の種まき時に30%短縮｜所持 '+e.fert,btn('5個 / 60 G','exfert',s.coins<60))}
else if(p==='fishing'){t='釣り場';h=row('釣り竿 Lv.'+(e.rod+1),'最大Lv.5・強化で珍しい魚の出現率アップ',btn(e.rod>=4?'最大':'強化 '+(200*(e.rod+1))+' G','exrod',e.rod>=4||s.coins<200*(e.rod+1)))+row('餌','小麦（N）1個から餌1個｜所持 '+e.bait,btn('作る','exbait',s.stock[0][0]<1))+ '<div class="action">'+(e.fishEnd?btn('釣り上げる '+timeText(e.fishEnd),'exfishget',sec(e.fishEnd)>0):btn('釣りをする（餌1個）','exfish',e.bait<1))+'</div>'+fishDefs.map((a,i)=>row(a[0],'所持 '+e.fish[i]+'匹｜'+a[1]+' G/匹',btn('売る','exfishsell:'+i,!e.fish[i]))).join('')}
else if(p==='decor'){t='農園装飾';h='<p>購入すると農園の道沿いに設置されます。</p>'+decDefs.map((a,i)=>row(a[0],fmt(a[1])+' G',btn(e.decor[i]?'設置済':'購入','exdecor:'+i,e.decor[i]||s.coins<a[1]))).join('')}
else if(p==='dragon'){t='ドラゴン育成';h='<p>ゲーム内コインで卵を購入し、孵化させて育てます。最大3体。ドラゴンはゲーム内コインの探索報酬を獲得できます。</p>'+e.dragons.map((d,i)=>row(d.hatched?dragDefs[d.type]+'ドラゴン Lv.'+d.lv:'ドラゴンの卵',d.end?timeText(d.end):'待機中',!d.hatched?btn('孵化','exhatch:'+i,sec(d.end)>0):btn('探索 '+(d.end?timeText(d.end):'開始'),'exdragontrip:'+i,d.end>0&&sec(d.end)>0)+btn('育成 '+d.lv*200+' G','exdragonup:'+i,d.lv>=10||s.coins<d.lv*200))).join('')+'<div class="action">'+btn('卵を購入 900 G','exegg',e.dragons.length>=3||s.coins<900)+'</div>'}
else{t='メニュー';h='<p>準備中です。</p>'}return [t,h]}
function extraAction(a,i){let e=ex(),msg='';if(a==='pet'&&petDefs[i]&&e.pet<0&&s.coins>=petDefs[i][1]){s.coins-=petDefs[i][1];e.pet=i;msg='ペットが仲間になりました！'}else if(a==='petgo'&&e.pet>=0&&!e.petEnd){e.petEnd=Date.now()+20000;msg='宝探しに出発！'}else if(a==='petget'&&e.petEnd&&sec(e.petEnd)===0){let v=petDefs[e.pet][2]+Math.floor(Math.random()*70);s.coins+=v;e.petEnd=0;msg='宝箱から '+v+' G！'}else if(a==='quest'){let t=tasks()[i];if(t&&!e.claimed.includes(i)&&t[1]>=t[2]){e.claimed.push(i);s.coins+=t[3];msg='クエスト達成！'}}else if(a==='daily'&&e.daily!==e.day){e.daily=e.day;s.coins+=150;s.seeds[0]+=5;msg='デイリーボーナス獲得！'}else if(a==='hire'&&e.helperEnd<=Date.now()&&s.coins>=150){s.coins-=150;e.helperEnd=Date.now()+60000;e.helperTick=Date.now();msg='助っ人が作業開始！'}else if(a==='tool'&&e.tool<5&&s.coins>=250*(e.tool+1)){s.coins-=250*(e.tool+1);e.tool++;msg='農具を強化しました'}else if(a==='fert'&&s.coins>=60){s.coins-=60;e.fert+=5;msg='肥料を購入'}else if(a==='rod'&&e.rod<4&&s.coins>=200*(e.rod+1)){s.coins-=200*(e.rod+1);e.rod++;msg='釣り竿を強化'}else if(a==='bait'&&s.stock[0][0]>0){s.stock[0][0]--;e.bait++;msg='餌を作りました'}else if(a==='fish'&&e.bait&&!e.fishEnd){e.bait--;e.fishEnd=Date.now()+12000;msg='魚を待っています'}else if(a==='fishget'&&e.fishEnd&&sec(e.fishEnd)===0){let u=Math.random(),k=u<.008*(e.rod+1)?4:u<.045*(e.rod+1)?3:u<.14+.05*e.rod?2:u<.46?1:0;e.fish[k]++;e.fishBook[k]++;e.fishEnd=0;s.xp+=6;msg=fishDefs[k][0]+' を釣りました！'}else if(a==='fishsell'&&fishDefs[i]&&e.fish[i]){s.coins+=e.fish[i]*fishDefs[i][1];e.fish[i]=0;msg='魚を売却'}else if(a==='decor'&&decDefs[i]&&!e.decor[i]&&s.coins>=decDefs[i][1]){s.coins-=decDefs[i][1];e.decor[i]=true;msg='装飾を設置！'}else if(a==='egg'&&e.dragons.length<3&&s.coins>=900){s.coins-=900;e.dragons.push({type:Math.floor(Math.random()*dragDefs.length),lv:1,hatched:false,end:Date.now()+30000});msg='卵を購入しました'}else if(a==='hatch'){let d=e.dragons[i];if(d&&!d.hatched&&sec(d.end)===0){d.hatched=true;d.end=0;msg='ドラゴンが孵化！'}}else if(a==='dragonup'){let d=e.dragons[i];if(d&&d.hatched&&d.lv<10&&s.coins>=d.lv*200){s.coins-=d.lv*200;d.lv++;msg='ドラゴンが成長！'}}else if(a==='dragontrip'){let d=e.dragons[i];if(d&&d.hatched){if(!d.end){d.end=Date.now()+30000;msg='探索へ出発！'}else if(sec(d.end)===0){s.coins+=d.lv*70;d.end=0;msg='探索報酬を獲得！'}}}if(msg)change(msg)}
function autoWork(){let e=ex(),until=Math.min(Date.now(),e.helperEnd);if(e.helperTick&&until-e.helperTick>=1000){let steps=Math.min(60,Math.floor((until-e.helperTick)/1000)),t=e.helperTick;for(let k=0;k<steps;k++){t+=1000;for(let i of Object.keys(s.plots)){let p=s.plots[i];if(p&&p.end<=t){let q=rollRank(+i),n=yieldFor(+i,t);s.stock[p.id][q]+=n;s.book[p.id][q]+=n;s.xp+=crops[p.id][5];e.harvested+=n;s.plots[i]=null}if(!s.plots[i]&&s.seeds[s.seed]>0){s.seeds[s.seed]--;let duration=growMs(s.seed,+i,e.fert>0);s.plots[i]={id:s.seed,end:t+duration,duration};if(e.fert)e.fert--;e.planted++}}}e.helperTick=t;save();stats()}}
const draw05=draw;draw=function(){draw05();let e=ex();c.setTransform(z,0,0,z,Math.round(vw/2-cx*z),Math.round(vh/2-cy*z));if(e.decor[0]){r(c,25,113,30,14,'#805839');for(let i=0;i<8;i++){r(c,28+i*3,116,2,6,'#3c783c');r(c,27+i*3,114,4,3,i%2?'#ef9ab5':'#f9d66c')}}if(e.decor[1]){r(c,190,111,24,5,'#976b40');r(c,192,118,3,6,'#67482f');r(c,209,118,3,6,'#67482f');r(c,190,106,24,4,'#bc8a50')}if(e.decor[2]){r(c,404,95,24,22,'#919d92');r(c,407,98,18,16,'#67b1ba');r(c,414,90,5,17,'#cad2c8');r(c,410,89,13,3,'#a2d4d7')}if(e.pet>=0){let x=121,y=119;r(c,x,y,12,7,'#d9a574');r(c,x+8,y-5,9,10,'#e8bb8b');r(c,x+9,y-7,2,4,'#ad734c');r(c,x+14,y-7,2,4,'#ad734c');r(c,x+14,y-2,1,2,'#3e382b');r(c,x-4,y-2,5,3,'#ad734c')}c.setTransform(1,0,0,1,0,0);$('farmtag').textContent=golden()?'☀ ゴールデンアワー　収穫2倍':'☀ 晴れ　｜　わたしの農園'};

const lands=[{name:'普通',desc:'標準の土壌。',soil:'#a36d43',rate:1,rare:1,bonus:0,fee:0},{name:'肥沃',desc:'25%の確率で収穫量が1個増える。',soil:'#866243',rate:1,rare:1,bonus:.25,fee:100},{name:'水辺',desc:'成長時間を15%短縮。',soil:'#976b4b',rate:.85,rare:1,bonus:0,fee:120},{name:'月光',desc:'レア出現率が1.5倍。',soil:'#8d665e',rate:1,rare:1.5,bonus:0,fee:180}];
function terrain(i){return lands[i<4?0:Math.floor(i/4)%4]}
function landCost(i){return cost()+terrain(i).fee}
function fm(){if(!s.progress)s.progress={research:0,cropResearch:crops.map(()=>0),trip:null,trips:0,city:[false,false,false],cityEnd:[0,0,0]};while(s.progress.cropResearch.length<crops.length)s.progress.cropResearch.push(0);return s.progress}
const weatherDefs=[['晴れ','☀',1,1],['雨','☂',.85,1],['星降る夜','✦',1,1.25],['そよ風','♧',.95,1]];
function weather(t=Date.now()){return weatherDefs[Math.floor(t/86400000)%weatherDefs.length]}
function season(){return ['春','夏','秋','冬'][Math.floor(Date.now()/86400000/7)%4]}
function growMs(id,i,fert){return Math.max(1000,Math.round(crops[id][3]*1000*(1-.08*ex().tool)*(fert?.7:1)*terrain(i).rate*weather()[2]*(1-.04*fm().cropResearch[id])))}
function rollRank(i){let p=s.plots[i],boost=terrain(i).rare*weather()[3]*(1+.1*fm().research+.08*(p?fm().cropResearch[p.id]:0)),a=Math.random()/boost;return a<.001?4:a<.01?3:a<.05?2:a<.18?1:0}
function yieldFor(i,t){return (golden(t)?2:1)+(Math.random()<terrain(i).bonus?1:0)}
const routes=[['こもれびの森',100,25,1],['星屑の鉱山',400,55,4],['月の遺跡',900,90,8]];
const city=[['農産物直売所',1800,5,60,220],['森のレストラン',4500,8,90,600],['月灯りの宿',9000,12,120,1250]];
const moreMenus=[['pets','ペット'],['quests','クエスト'],['daily','デイリー'],['helper','助っ人'],['fishing','釣り'],['tools','道具'],['decor','装飾'],['dragon','ドラゴン'],['research','研究所'],['explore','探索'],['city','街づくり'],['settings','設定']];
function farmPanel(p){let e=fm(),h='';if(p==='more')return ['その他','<div class="moregrid">'+moreMenus.map((a,i)=>btn(a[1],'fmnav:'+i)).join('')+'</div>'];
if(p==='research'){h='<p>研究所で品種改良を行い、作物の成長速度やレア出現率を上げます。まず研究所を開設（Lv.4）。</p>'+row('研究所 Lv.'+e.research,'全作物のレア率：'+(100+e.research*10)+'%',btn(e.research>=5?'最大':'研究 '+fmt(500*(e.research+1))+' G','fmresearch',lv()<4||e.research>=5||s.coins<500*(e.research+1)));if(e.research)h+=crops.map((a,i)=>{let n=e.cropResearch[i],fee=180*(n+1);return row(a[0]+' 改良Lv.'+n,'N作物3個＋'+fee+' G／成長−'+n*4+'%',btn(n>=5?'最大':'品種改良','fmbreed:'+i,n>=5||s.coins<fee||s.stock[i][0]<3))}).join('');return ['研究所',h]}
if(p==='explore'){h='<p>探索隊を派遣するとコインと種を持ち帰ります。同時に1か所まで。</p>';if(e.trip){let a=routes[e.trip.id];h+=row(a[0],timeText(e.trip.end),btn('報酬を回収','fmreturn',sec(e.trip.end)>0))}else h+=routes.map((a,i)=>row(a[0],'Lv.'+a[3]+'／'+a[1]+' G／'+a[2]+'秒',btn('派遣','fmtrip:'+i,lv()<a[3]||s.coins<a[1]))).join('');return ['探索',h]}
if(p==='city'){h='<p>農園の発展で観光施設を建設できます。建設費はコインのみ。定期的に売上を回収できます。</p>'+city.map((a,i)=>row(a[0],!e.city[i]?'Lv.'+a[2]+'／'+fmt(a[1])+' G':'収益 '+a[4]+' G／'+timeText(e.cityEnd[i]),!e.city[i]?btn('建設','fmcity:'+i,lv()<a[2]||s.coins<a[1]):btn('売上回収','fmcityget:'+i,sec(e.cityEnd[i])>0))).join('')+'<div class="action">'+btn('街へ移動','fmcitymap')+'</div>';return ['街づくり',h]}return null}
function farmAction(a,i){let e=fm(),msg='';if(a==='nav'&&moreMenus[i]){open(moreMenus[i][0]);return}if(a==='citymap'){close();z=1.1;cx=320;cy=920;clamp();draw();return}if(a==='research'&&lv()>=4&&e.research<5&&s.coins>=500*(e.research+1)){s.coins-=500*(e.research+1);e.research++;msg='研究所を強化しました'}else if(a==='breed'&&crops[i]&&e.research){let n=e.cropResearch[i],fee=180*(n+1);if(n<5&&s.coins>=fee&&s.stock[i][0]>=3){s.coins-=fee;s.stock[i][0]-=3;e.cropResearch[i]++;msg=crops[i][0]+' の品種改良に成功！'}}else if(a==='trip'&&routes[i]&&!e.trip&&lv()>=routes[i][3]&&s.coins>=routes[i][1]){s.coins-=routes[i][1];e.trip={id:i,end:Date.now()+routes[i][2]*1000};msg='探索へ出発！'}else if(a==='return'&&e.trip&&sec(e.trip.end)===0){let a=routes[e.trip.id],eligible=crops.map((c,i)=>i).filter(i=>crops[i][4]<=lv()),j=eligible[Math.floor(Math.random()*eligible.length)],g=Math.floor(a[1]*(1.15+Math.random()*.65));s.coins+=g;s.seeds[j]+=3;e.trip=null;e.trips++;msg='探索報酬 '+g+' G ＋ '+crops[j][0]+'の種3個'}else if(a==='city'&&city[i]&&!e.city[i]&&lv()>=city[i][2]&&s.coins>=city[i][1]){s.coins-=city[i][1];e.city[i]=true;e.cityEnd[i]=Date.now()+city[i][3]*1000;msg=city[i][0]+' を建設！'}else if(a==='cityget'&&city[i]&&e.city[i]&&sec(e.cityEnd[i])===0){s.coins+=city[i][4];e.cityEnd[i]=Date.now()+city[i][3]*1000;msg='売上 '+city[i][4]+' G を回収！'}if(msg)change(msg)}
const draw06=draw;draw=function(){draw06();let w=weather();$('farmtag').textContent=golden()?'✦ ゴールデンアワー　収穫2倍':w[1]+' '+w[0]+' ｜ '+season()+'の農園';c.setTransform(z,0,0,z,Math.round(vw/2-cx*z),Math.round(vh/2-cy*z));pathTile(c,0,833,640,15);for(let i=0;i<3;i++){let x=22+i*204,y=860,a=city[i];r(c,x,y,178,115,'#8db25e');for(let k=0;k<10;k++){r(c,x+k*17,y+3,3,9,'#94683b');r(c,x+k*17,y+105,3,9,'#94683b')}if(fm().city[i]){facilityHouse(x+55,y+9,['#6b9459','#b45c42','#657a9c'][i]);label(x+89,y+91,sec(fm().cityEnd[i])?'営業中':'売上回収','#ffdc75')}else{r(c,x+35,y+28,108,44,'#70934b');label(x+89,y+54,'＋ 建設','#e0eab8')}richLabel(x+89,y+13,a[0])}c.setTransform(1,0,0,1,0,0)};

autoWork();
stats();resize();new ResizeObserver(resize).observe($('world'));setInterval(()=>{autoWork();draw();if(['future','facility','pets','helper','fishing','dragon','explore','city'].includes(panel))render()},1000);
</script></body></html>
