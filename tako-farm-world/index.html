else if(a==='team'&&i>=0&&i<3){let j=(i+1)%3;[e.team[i],e.team[j]]=[e.team[j],e.team[i]];msg='編成順を変更'}
else if(a==='battle'&&e.pets.every(Boolean)){let team=e.team.map(j=>({id:j,hp:100+Math.floor(e.petXP[j]/30)*8,atk:20+Math.floor(e.petXP[j]/30)*2})),rival=[0,1,2].map(j=>({id:(j+i)%3,hp:70+i*25,atk:15+i*6})),log=[],round=0;let strong=[1,2,0];while(team.some(x=>x.hp>0)&&rival.some(x=>x.hp>0)&&round++<40){let x=team.find(x=>x.hp>0),y=rival.find(x=>x.hp>0);let d=Math.round(x.atk*(strong[x.id]===y.id?1.4:strong[y.id]===x.id?.75:1));y.hp=Math.max(0,y.hp-d);log.push(pet10[x.id][0]+' の攻撃 −'+d);if(y.hp>0){let z=Math.round(y.atk*(strong[y.id]===x.id?1.4:strong[x.id]===y.id?.75:1));x.hp=Math.max(0,x.hp-z)}}let win=!rival.some(x=>x.hp>0);if(win)e.wins++;else e.loss++;e.team.forEach(j=>e.petXP[j]+=win?12:4);arenaLog10='<b>'+(win?'勝利！':'敗北')+'</b><p>'+log.slice(-6).join('<br>')+'</p>';msg=win?'バトル勝利':'練習戦終了'}
else if(a==='dragonbuy'&&!e.dragon[i]&&pay(500+i*250)){e.dragon[i]=1;msg='ドラゴンが仲間になりました'}
else if(a==='dragonup'&&e.dragon[i]>0&&e.dragon[i]<10&&pay(200*e.dragon[i])){e.dragon[i]++;msg='ドラゴンが成長'}
else if(a==='dragonwork'&&e.dragon[i]&&e.rest[i]<=now()){e.rest[i]=now()+120000;e.boost[i]=now()+60000;if(i===1)Object.values(s.plots).filter(p=>p&&!ready(p)).slice(0,2+e.dragon[i]).forEach(p=>{p.end=now()+Math.round((p.end-now())*.7)});msg='ドラゴンがお手伝い開始'}
else if(a==='dragonmap'){close();scale=fit;tx=0;ty=-1180*scale;clamp();return}
else if(a==='hire'&&pay([100,180,250,320][i])){e.helperEnd=Math.max(now(),e.helperEnd)+[60,120,180,240][i]*1000;e.helperTick=now();msg='スタッフを雇いました'}
else if(a==='water'){let p=s.plots[selected];if(p&&!ready(p)&&!p.watered&&e.energy>0){p.watered=true;e.energy--;e.water++;p.end=now()+Math.round((p.end-now())*.8);msg='水やりしました'}}
else if(a==='harvest'){let r=harvest(selected);if(r){close();msg=r+' を収穫'}}
else if(a==='legacySell'&&val(i)){s.coins+=val(i);s.stock[i].fill(0);msg='出荷しました'}
if(msg){e.earned+=Math.max(0,s.coins-before);update(msg)}
};
