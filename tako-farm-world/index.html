function btn(t,a,d=false){return '<button class="primary" data-a="'+a+'" '+(d?'disabled':'')+'>'+t+'</button>'}function row(n,d,b){return '<div class="row"><div>'+n+'<small>'+d+'</small></div>'+b+'</div>'}
function render(){let t='',h='';if(panel==='shop'){t='種ショップ';h=crops.map((a,i)=>row(a[0],a[1]+' G・'+a[3]+'秒・Lv.'+a[4]+'｜所持 '+s.seeds[i],btn('選択','pick:'+i,lv()<a[4])+btn('+1','buy:'+i,lv()<a[4]||s.coins<a[1])+btn('+5','buy5:'+i,lv()<a[4]||s.coins<a[1]*5))).join('')}else if(panel==='stock'){t='倉庫・出荷';h=crops.map((a,i)=>row(a[0],s.stock[i].map((v,q)=>ranks[q]+':'+v).join('　'),btn(fmt(val(i))+' G','sell:'+i,!val(i)))).join('')+'<div class="action">'+btn('すべて出荷','sellall',!crops.some((_,i)=>val(i)))+'</div>'+goodsPanel()}else if(panel==='book'){t='作物図鑑 '+s.book.flat().filter(Boolean).length+'/25';h=crops.map((a,i)=>row(a[0],'累計 '+s.book[i].reduce((x,y)=>x+y,0)+'個',ranks.map((q,j)=>'<span class="rank '+(!s.book[i][j]?'dim':'')+'" style="color:'+colors[j]+'">'+q+'</span>').join(''))).join('')+'<h2 style="margin-top:14px">畜産・加工品図鑑</h2>'+facDefs.map((a,i)=>row(s.goodsBook[i]?a.good:'？？？',s.goodsBook[i]?'累計 '+s.goodsBook[i]+' 個':'未発見','')).join('')}else if(panel==='buyland'){t='畑の購入';h='<p>新しい畑を購入します。現在 '+count()+' / '+beds.length+' 枚。</p><div class="action">'+btn(fmt(cost())+' Gで購入','land',own(selected)||s.coins<cost())+'</div>'}else if(panel==='land'){t='土地・施設';h='<p>畑：'+count()+' / '+beds.length+'枚<br>マップの「＋ 購入」をタップしてください。牧場や加工施設は下側のエリアで購入できます。自由配置は今後追加予定です。</p>'}else if(panel==='market'){t='本日の市場';h=crops.map((a,i)=>row(a[0],'基本価格 '+a[2]+' G',fmt(price(i))+' G')).join('')}else if(panel==='orders'){t='注文ボード';let i=s.orders%crops.length,n=3+s.orders%4;h='<p>注文 No.'+(s.orders+1)+'</p>'+row(crops[i][0]+'（N）×'+n,'報酬 '+fmt(price(i)*n*2)+' G',btn('納品','order',s.stock[i][0]<n))}else if(panel==='profile'){t='農園プロフィール';h='<p>レベル：'+lv()+'<br>所有畑：'+count()+'枚<br>納品：'+s.orders+'回<br>累計収穫：'+s.book.flat().reduce((a,b)=>a+b,0)+'個</p>'}else if(panel==='settings'){t='設定';h='<p>端末内に自動保存します。<br>成長時間と出現率はテスト用です。<br>課金・オンライン保存は未実装です。</p><div class="action">'+btn('保存','save')+btn('リセット','reset')+'</div>'}else if(panel==='future'||panel==='facility'){t=panel==='facility'?facDefs[chosenFacility].name:'牧場・加工施設';h=facilityPanel(panel==='facility'?[chosenFacility]:[0,1,2,3])}else{t='メニュー';h=''}$('sheet').innerHTML='<button class="close" data-a="close">閉じる</button><h2>'+t+'</h2>'+h}
$('sheet').onclick=e=>{let b=e.target.closest('[data-a]');if(!b||b.disabled)return;let [a,k]=b.dataset.a.split(':'),i=+k;if(a==='close')close();else if(a.startsWith('fac')||a==='goodsell'||a==='ranchjump'){facilityAction(a,i)}else if(a==='pick'&&lv()>=crops[i][4]){s.seed=i;close();change(crops[i][0]+' を選択')}else if(a==='buy'||a==='buy5'){let n=a==='buy5'?5:1;if(lv()>=crops[i][4]&&s.coins>=crops[i][1]*n){s.coins-=crops[i][1]*n;s.seeds[i]+=n;s.seed=i;change('種を'+n+'個購入')}}else if(a==='sell'||a==='sellall'){let g=0;(a==='sell'?[i]:crops.map((_,i)=>i)).forEach(j=>{g+=val(j);s.stock[j].fill(0)});s.coins+=g;change(fmt(g)+' Gを獲得')}else if(a==='land'&&!own(selected)&&s.coins>=cost()){s.coins-=cost();s.plots[selected]=null;close();change('畑を購入しました')}else if(a==='order'){let j=s.orders%crops.length,n=3+s.orders%4;if(s.stock[j][0]>=n){s.stock[j][0]-=n;s.coins+=price(j)*n*2;s.orders++;s.xp+=10;change('納品完了！')}}else if(a==='save'){save();close();note('保存しました')}else if(a==='reset'&&confirm('農園を最初からやり直しますか？')){s=fresh();close();change('新しい農園を開始')}};

const facDefs=[
{name:'養鶏場',good:'卵',x:14,cost:650,lv:2,secs:25,wheat:1,sale:45,roof:'#ae5943'},
{name:'牛の牧場',good:'牛乳',x:174,cost:1200,lv:3,secs:40,wheat:2,sale:95,roof:'#a35644'},
{name:'製粉所',good:'小麦粉',x:334,cost:950,lv:3,secs:30,wheat:3,sale:90,roof:'#687f9b'},
{name:'パン工房',good:'パン',x:494,cost:2100,lv:4,secs:50,wheat:0,sale:260,roof:'#a77d43'}];
let chosenFacility=0;
function facilityPanel(indices){return '<p>施設はコインで購入します。材料を入れると時間経過で生産されます。</p>'+indices.map(i=>{let a=facDefs[i],p=s.fac[i],left=p&&p.end?Math.max(0,Math.ceil((p.end-Date.now())/1000)):0,mat=i===3?'小麦粉×1・卵×1':'小麦（N）×'+a.wheat,can=i===3?s.goods[2]>0&&s.goods[0]>0:s.stock[0][0]>=a.wheat;return row(a.name,!p?'Lv.'+a.lv+' / '+fmt(a.cost)+' G':p.end?(left?'生産中：約'+left+'秒':'回収可能'):'材料：'+mat,!p?btn('購入','facbuy:'+i,lv()<a.lv||s.coins<a.cost):p.end?btn('回収','facget:'+i,left>0):btn(i<2?'餌やり':'製造開始','facstart:'+i,!can))}).join('')+'<div class="action">'+btn('牧場マップへ','ranchjump')+'</div>'}
function goodsPanel(){return '<h2 style="margin-top:15px">畜産・加工品</h2>'+facDefs.map((a,i)=>row(a.good,'所持 '+s.goods[i]+' 個',btn(fmt(s.goods[i]*a.sale)+' Gで売る','goodsell:'+i,!s.goods[i]))).join('')}
function facilityAction(a,i){if(a==='ranchjump'){close();goRanch();return}let d=facDefs[i];if(!d)return;let p=s.fac[i];if(a==='facbuy'&&!p&&lv()>=d.lv&&s.coins>=d.cost){s.coins-=d.cost;s.fac[i]={end:0};change(d.name+' を建設！')}else if(a==='facstart'&&p&&!p.end){if(i===3){if(s.goods[2]<1||s.goods[0]<1)return;s.goods[2]--;s.goods[0]--}else{if(s.stock[0][0]<d.wheat)return;s.stock[0][0]-=d.wheat}p.end=Date.now()+d.secs*1000;change('生産を開始しました')}else if(a==='facget'&&p&&p.end&&p.end<=Date.now()){p.end=0;s.goods[i]++;s.goodsBook[i]++;s.xp+=12+i*4;change(d.good+' を回収！')}else if(a==='goodsell'&&s.goods[i]>0){let g=s.goods[i]*d.sale;s.goods[i]=0;s.coins+=g;change(fmt(g)+' Gを獲得！')}}
function goRanch(){z=1.15;cx=320;cy=720;clamp();draw()}
$('ranch').onclick=goRanch;
function animal(x,y,cow){r(c,x,y+12,21,4,'#648348');if(cow){r(c,x+2,y+3,18,10,'#e9e3d0');r(c,x+5,y+4,5,6,'#705347');r(c,x+15,y+5,4,5,'#705347');r(c,x+18,y+2,8,8,'#e1d8c5');r(c,x+22,y+7,5,4,'#ad8172');r(c,x+24,y+4,1,2,'#352f2c');r(c,x+4,y+12,3,5,'#6a4d3d');r(c,x+14,y+12,3,5,'#6a4d3d')}else{r(c,x+4,y+4,10,10,'#eee1ba');r(c,x+11,y+1,7,8,'#f3e7c7');r(c,x+13,y-1,4,3,'#b94a38');r(c,x+17,y+4,3,2,'#db9e46');r(c,x+15,y+3,1,1,'#443b29');r(c,x+8,y+14,2,3,'#c48f3f')}}
function facilityHouse(x,y,roof){r(c,x+3,y+11,66,50,'#587b3d');r(c,x,y+21,64,38,'#855a38');r(c,x+3,y+24,58,33,'#d0a06b');for(let yy=y+28;yy<y+57;yy+=6)r(c,x+3,yy,58,1,'#b28756');for(let k=0;k<7;k++){let q=14-k*2;r(c,x+q-3,y+k*4,70-2*q,4,roof);r(c,x+q-3,y+k*4,70-2*q,1,'#684b40')}r(c,x+26,y+35,15,24,'#815032');r(c,x+28,y+37,11,22,'#ad7746');for(let xx of [x+7,x+47]){r(c,xx,y+32,10,11,'#75543b');r(c,xx+2,y+34,6,7,'#9fc5bf')}}
function drawFacilities(){c.setTransform(z,0,0,z,Math.round(vw/2-cx*z),Math.round(vh/2-cy*z));r(c,0,634,640,13,'#b89f68');facDefs.forEach((a,i)=>{let x=a.x,y=654,p=s.fac[i];r(c,x,y,140,144,'#87ab59');for(let k=0;k<8;k++){r(c,x+7+k*16,y+7,3,13,'#885e39');r(c,x+7+k*16,y+130,3,13,'#885e39')}for(let yy of [y+10,y+136]){r(c,x+4,yy,132,3,'#805834');r(c,x+4,yy+5,132,2,'#b5894b')}for(let xx of [x+4,x+134])r(c,xx,y+12,3,125,'#9a7042');if(p){facilityHouse(x+12,y+18,a.roof);if(i<2){animal(x+90,y+42,i===1);animal(x+83,y+80,i===1);animal(x+30,y+93,i===1)}else if(i===2){r(c,x+91,y+25,12,61,'#755a43');r(c,x+85,y+18,24,8,'#9e7950');r(c,x+88,y+35,21,5,'#dac397');r(c,x+96,y+26,5,24,'#d9c397')}else{r(c,x+88,y+68,24,20,'#81583a');r(c,x+92,y+71,16,8,'#e0b568');r(c,x+115,y+36,8,18,'#775343')}label(x+70,y+119,p.end?(p.end<=Date.now()?'回収可能':Math.ceil((p.end-Date.now())/1000)+'秒'):'稼働待ち',p.end&&p.end<=Date.now()?'#ffdc75':'#e9efda')}else{r(c,x+28,y+39,84,50,'#70934b');label(x+70,y+68,'＋ 建設','#e0eab8');label(x+70,y+110,fmt(a.cost)+' G','#f2d478')}label(x+70,y+25,a.name)});c.setTransform(1,0,0,1,0,0)}
const baseDraw=draw;draw=function(){baseDraw();drawFacilities()};

stats();resize();new ResizeObserver(resize).observe($('world'));setInterval(()=>{draw();if(panel==='future'||panel==='facility')render()},1000);
</script></body></html>
